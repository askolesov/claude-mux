<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-mux</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='14' fill='%231c2029' stroke='%237aa2f7' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161920;
    --panel-2: #1c2029;
    --line: #262b36;
    --text: #d7dae0;
    --muted: #7d8494;
    --accent: #7aa2f7;
    --working: #7aa2f7;
    --ready: #4fd18b;
    --needs: #f5b14c;
    --dead: #5b6170;
    --danger: #f16c6c;
    --on-accent: #0f1115;
    --mono: "JetBrains Mono", "SF Mono", Menlo, monospace;
  }
  /* Light: chosen in the footer, or Auto on a light system. */
  :root[data-theme="light"] {
    --bg: #ffffff;
    --panel: #f6f7f9;
    --panel-2: #eceef2;
    --line: #d9dde4;
    --text: #1d2129;
    --muted: #646c7c;
    --accent: #2f5fd0;
    --on-accent: #ffffff;
    --working: #2f5fd0;
    --ready: #1f9d5c;
    --needs: #c27a10;
    --dead: #9aa1ad;
    --danger: #d64545;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
    --bg: #ffffff;
      --panel: #f6f7f9;
      --panel-2: #eceef2;
      --line: #d9dde4;
      --text: #1d2129;
      --muted: #646c7c;
      --accent: #2f5fd0;
      --on-accent: #ffffff;
      --working: #2f5fd0;
      --ready: #1f9d5c;
      --needs: #c27a10;
      --dead: #9aa1ad;
      --danger: #d64545;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: var(--side, 270px) 1fr; overflow: hidden;
  }
  button {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }

  /* sidebar */
  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0; min-width: 0; position: relative;
  }
  .grip { position: absolute; top: 0; right: -4px; width: 8px; height: 100%; cursor: col-resize; z-index: 5; touch-action: none; }
  .grip:hover, .grip.dragging { background: linear-gradient(to right, transparent 3px, var(--accent) 3px, var(--accent) 5px, transparent 5px); }
  body.resizing { cursor: col-resize; user-select: none; }
  .brand { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 8px; }
  .brand b { font-family: var(--mono); font-size: 14px; letter-spacing: .02em; }
  .summary { padding: 0 12px 8px; color: var(--muted); font-size: 12px; }
  .summary .n { color: var(--text); font-weight: 600; }
  .list { flex: 1; overflow-y: auto; padding-bottom: 8px; }
  .section { padding: 12px 12px 4px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .tab {
    display: grid; grid-template-columns: 14px 1fr auto; gap: 2px 8px; align-items: center;
    padding: 7px 12px; margin: 1px 6px; border-radius: 6px; cursor: pointer; border: 1px solid transparent;
  }
  .tab:hover { background: var(--panel-2); }
  .tab.active { background: var(--panel-2); border-color: var(--line); }
  .tab .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab.unseen .name { font-weight: 700; }
  .tab .key { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .tab .sub { grid-column: 2 / 4; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab.unseen { box-shadow: inset 3px 0 0 var(--ready); }
  .tab.needs-you { box-shadow: inset 3px 0 0 var(--needs); }
  .tab.external { opacity: .85; }
  .star { color: var(--needs); }
  .dot.saved { background: transparent; border: 2px dashed var(--muted); }
  .tab.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  .tab.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
  .tab.dragging { opacity: .4; }
  .empty { padding: 4px 18px; color: var(--muted); font-size: 12px; }
  .group {
    display: flex; align-items: center; gap: 6px; padding: 5px 12px; margin: 4px 6px 1px; border-radius: 6px;
    cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 600; user-select: none; border: 1px solid transparent;
  }
  .group:hover { background: var(--panel-2); color: var(--text); }
  .group .caret { width: 10px; font-size: 10px; }
  .group .gname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .group .gcount { font-weight: 400; font-size: 11px; }
  .group .dot { width: 8px; height: 8px; margin-left: auto; }
  .group.drop-into { border-color: var(--accent); }
  .tab.in-group { margin-left: 18px; }

  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dead); justify-self: center; }
  .dot.working { background: var(--working); animation: pulse 1.2s ease-in-out infinite; }
  .dot.starting { background: var(--muted); animation: pulse 1.2s ease-in-out infinite; }
  .dot.ready { background: var(--ready); }
  .dot.needs-you { background: var(--needs); animation: pulse .8s ease-in-out infinite; }
  .dot.exited, .dot.stopped { background: transparent; border: 2px solid var(--dead); }
  .dot.ext { background: transparent; border: 2px solid var(--muted); }
  .dot.ext.busy { border-color: var(--working); }
  @keyframes pulse { 50% { opacity: .35; } }

  .foot { border-top: 1px solid var(--line); padding: 8px 12px; color: var(--muted); font-size: 11px; line-height: 1.7; }
  .foot kbd { font-family: var(--mono); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--text); }
  .foot button { margin-top: 6px; font-size: 11px; padding: 2px 8px; }
  .prefs { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
  .prefs label { display: flex; align-items: center; gap: 4px; }
  .prefs select { font: 11px inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 4px; }

  /* main */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .bar {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    border-bottom: 1px solid var(--line); background: var(--panel); min-height: 45px;
  }
  .bar .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .cwd { color: var(--muted); font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill.ready { color: var(--ready); border-color: var(--ready); }
  .pill.needs-you { color: var(--needs); border-color: var(--needs); }
  .pill.working { color: var(--working); border-color: var(--working); }
  .bar .actions { display: flex; gap: 6px; }
  .stage { flex: 1; position: relative; min-height: 0; }
  .term { position: absolute; inset: 0; padding: 6px 0 0 10px; display: none; background: var(--bg); }
  .term.shown { display: block; }
  .placeholder { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; }
  .placeholder p { margin: 6px 0; }

  .transcript { position: absolute; inset: 0 0 var(--composer-h, 64px) 0; overflow-y: auto; padding: 16px 22px 24px; display: none; }
  .transcript.shown { display: block; }
  .transcript .note { color: var(--muted); margin-bottom: 14px; }
  .msg { margin: 0 0 14px; word-break: break-word; max-width: 900px; }
  .msg.user .body { white-space: pre-wrap; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 0 0 8px; }
  .md ul, .md ol { padding-left: 22px; }
  .md li { margin: 2px 0; }
  .md li > ul, .md li > ol { margin: 2px 0; }
  .md h1, .md h2, .md h3, .md h4 { font-size: 14px; margin: 12px 0 6px; }
  .md code { font: 12px var(--mono); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .md pre { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; overflow-x: auto; }
  .md pre code { background: none; border: 0; padding: 0; }
  .md a { color: var(--accent); }
  .md table { border-collapse: collapse; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  .md blockquote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); }
  .composer { position: absolute; left: 0; right: 0; bottom: 0; display: none; gap: 8px; padding: 12px 22px; border-top: 1px solid var(--line); background: var(--panel); }
  .composer.shown { display: flex; }
  .composer textarea { flex: 1; font: 13px/1.4 var(--mono); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; resize: none; max-height: 160px; }
  .composer textarea:focus { outline: none; border-color: var(--accent); }
  .composer { align-items: flex-end; }
  .composer .hint { color: var(--muted); font-size: 12px; align-self: center; white-space: nowrap; }
  .msg .who { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 2px; }
  .msg.user .body { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; }
  .msg.tool { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 4px; }

  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; width: min(460px, 92vw);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .5); }

  .menu {
    position: fixed; z-index: 50; min-width: 190px; padding: 4px; display: none;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
  }
  .menu.open { display: block; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; border-radius: 5px; padding: 6px 10px; }
  .menu button:hover { background: var(--line); }
  .menu button.danger:hover { color: var(--danger); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
  dialog h3 { margin: 0 0 12px; font-size: 15px; }
  dialog label { display: block; color: var(--muted); font-size: 12px; margin: 10px 0 4px; }
  dialog input {
    width: 100%; font: 13px var(--mono); color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px;
  }
  dialog input:focus { outline: none; border-color: var(--accent); }
  dialog .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  dialog .checks { display: flex; gap: 18px; margin-top: 12px; }
  dialog .checks label { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--text); font: 12px var(--mono); cursor: pointer; }
  dialog .checks input { width: auto; margin: 0; accent-color: var(--accent); }
  dialog textarea {
    width: 100%; font: 13px/1.4 var(--mono); color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; resize: vertical;
  }
  dialog textarea:focus { outline: none; border-color: var(--accent); }
  dialog .err { color: var(--danger); font-size: 12px; margin-top: 8px; min-height: 1em; }
</style>
</head>
<body>
<aside>
  <div class="grip" id="grip" title="Drag to resize · double-click to reset"></div>
  <div class="brand"><b>claude-mux</b><button id="new" title="New session (⌥N)">+ New</button></div>
  <div class="summary" id="summary"></div>
  <div class="list" id="list"></div>
  <div class="foot">
    <kbd>⌥1–9</kbd> tab · <kbd>⌥↑↓</kbd> prev/next · <kbd>⌥J</kbd> next waiting<br>
    <kbd>⌥N</kbd> new · <kbd>⇧↵</kbd> newline
    <div class="prefs">
      <label>Theme <select id="pageTheme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
      <label>Terminal <select id="termTheme"><option value="auto">Auto</option><option value="dark">Dark</option><option value="light">Light</option><option value="tokyo-night">Tokyo Night</option><option value="dracula">Dracula</option><option value="solarized-dark">Solarized Dark</option><option value="solarized-light">Solarized Light</option></select></label>
    </div>
    <div><button id="notify" hidden>Enable notifications</button></div>
  </div>
</aside>
<main>
  <div class="bar" id="bar"></div>
  <div class="stage" id="stage">
    <div class="placeholder" id="placeholder">
      <div><p>No session selected.</p><p><button class="primary" id="new2">+ New session</button></p></div>
    </div>
    <div class="transcript" id="transcript"></div>
    <form class="composer" id="composer">
      <textarea id="cText" rows="1" placeholder="Message this session — typed into its terminal window (⇧↵ new line)"></textarea>
      <span class="hint" id="cHint"></span>
      <button class="primary">Send</button>
    </form>
  </div>
</main>

<div class="menu" id="menu"></div>

<dialog id="restoreDlg">
  <form method="dialog" id="restoreForm">
    <h3>Restore message</h3>
    <label for="rText">Sent as the first prompt whenever this conversation starts in a new process: Open here, Open in Terminal, Move, Resume, and after a claude-mux restart. Empty means none.</label>
    <textarea id="rText" rows="5" placeholder="e.g. restart the ops watch"></textarea>
    <div class="row"><button type="button" id="rCancel">Cancel</button><button class="primary">Save</button></div>
  </form>
</dialog>

<datalist id="groups"></datalist>

<dialog id="groupDlg">
  <form method="dialog" id="groupForm">
    <h3 id="gTitle">Group</h3>
    <label for="gName" id="gHint"></label>
    <input id="gName" list="groups" autocomplete="off">
    <div class="row"><button type="button" id="gCancel">Cancel</button><button class="primary">Save</button></div>
  </form>
</dialog>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h3 id="dlgTitle">New session</h3>
    <label for="fName">Name</label>
    <input id="fName" placeholder="defaults to the folder name" autocomplete="off">
    <label for="fGroup">Group</label>
    <input id="fGroup" list="groups" placeholder="none" autocomplete="off">
    <label for="fCwd">Directory</label>
    <input id="fCwd" list="cwds" autocomplete="off">
    <datalist id="cwds"></datalist>
    <label for="fArgs">Extra claude args</label>
    <input id="fArgs" placeholder="e.g. --model opus --permission-mode acceptEdits" autocomplete="off">
    <div class="checks">
      <label><input type="checkbox" id="fSkip"> --dangerously-skip-permissions</label>
      <label><input type="checkbox" id="fChrome"> --chrome</label>
    </div>
    <div class="err" id="dlgErr"></div>
    <div class="row"><button type="button" id="dlgCancel">Cancel</button><button class="primary" id="dlgOk">Start</button></div>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

let state = { sessions: [], external: [], favourites: [], defaultCwd: "" };
let selected = null;             // {kind: "s" | "x" | "f", id}: running here, in Terminal, saved
const terms = new Map();         // session id -> {term, fit, ws, el, closed}
const lastStatus = new Map();    // session id -> status, for notifications
let transcriptTimer = null;

const STATUS_TEXT = {
  starting: "starting", working: "working", ready: "ready for input",
  "needs-you": "needs you", exited: "exited", stopped: "stopped",
};

// ---------- api ----------
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).error || msg; } catch {}
    throw new Error(msg);
  }
  return res.status === 204 ? null : res.json();
}

// ---------- helpers ----------
function ago(ts) {
  const s = Math.max(0, (Date.now() - new Date(ts).getTime()) / 1000);
  if (s < 60) return `${Math.floor(s)}s`;
  if (s < 3600) return `${Math.floor(s / 60)}m`;
  if (s < 86400) return `${Math.floor(s / 3600)}h`;
  return `${Math.floor(s / 86400)}d`;
}
const base = (p) => p.split("/").filter(Boolean).pop() || p;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const waiting = (s) => s.status === "needs-you" || (s.status === "ready" && s.unseen);
const isSaved = (sid) => !!sid && state.favourites.some((f) => f.claudeSessionId === sid);
const favourite = (sid) => state.favourites.find((f) => f.claudeSessionId === sid);
const star = (sid) => !isSaved(sid) ? "" : `<span class="star" title="Saved">★</span>${
  favourite(sid).onRestore ? `<span class="star" title="Restore message: ${esc(favourite(sid).onRestore)}">↻</span>` : ""} `;
// Saved conversations that run nowhere: no tab holds them and no terminal runs them.
const idleSaved = () => state.favourites.filter((f) =>
  !state.sessions.some((s) => s.claudeSessionId === f.claudeSessionId) &&
  !state.external.some((x) => x.sessionId === f.claudeSessionId));

// ---------- groups ----------
// A group is a label on tabs and saved conversations; its items sit together
// under one header. Collapsing is per browser, per section.
const collapsed = new Set((() => { try { return JSON.parse(store.get("mux.collapsed") || "[]"); } catch { return []; } })());
function setCollapsed(key, shut) {
  shut ? collapsed.add(key) : collapsed.delete(key);
  store.set("mux.collapsed", JSON.stringify([...collapsed]));
}
const allGroups = () => [...new Set([...state.sessions.map((s) => s.group), ...state.favourites.map((f) => f.group)].filter(Boolean))];

// grouped splits items into runs: each group, at its first item, and every
// ungrouped item on its own.
function grouped(items, groupOf) {
  const runs = [];
  const byName = new Map();
  for (const it of items) {
    const g = groupOf(it);
    if (!g) { runs.push({ group: "", items: [it] }); continue; }
    if (!byName.has(g)) { byName.set(g, { group: g, items: [] }); runs.push(byName.get(g)); }
    byName.get(g).items.push(it);
  }
  return runs;
}

// The most urgent status in a group, shown on its header while it's collapsed.
function groupDot(sessions) {
  if (sessions.some((s) => s.status === "needs-you")) return "needs-you";
  if (sessions.some((s) => s.status === "ready" && s.unseen)) return "ready";
  if (sessions.some((s) => s.status === "working" || s.status === "starting")) return "working";
  return "";
}

function groupHeader(kind, run, dot) {
  const shut = collapsed.has(kind + ":" + run.group);
  return `<div class="group" data-kind="${kind}" data-group="${esc(run.group)}" title="Click to ${shut ? "expand" : "collapse"} · right-click for actions">
    <span class="caret">${shut ? "▸" : "▾"}</span><span class="gname">${esc(run.group)}</span><span class="gcount">${run.items.length}</span>
    ${shut && dot ? `<span class="dot ${dot}"></span>` : ""}</div>`;
}

// renderRuns renders a section's items, grouped; tabs of a collapsed group are left out.
function renderRuns(kind, runs, tab, dot = () => "") {
  let html = "";
  for (const run of runs) {
    if (!run.group) { html += tab(run.items[0], false); continue; }
    html += groupHeader(kind, run, dot(run.items));
    if (!collapsed.has(kind + ":" + run.group)) for (const it of run.items) html += tab(it, true);
  }
  return html;
}

// ---------- icon ----------
// Tabs on the left, a prompt on the right; a dot when something waits:
// amber for a session that needs you, green for one that finished unseen.
function favicon(dot) {
  const badge = dot ? `<circle cx="48" cy="16" r="14" fill="${dot}" stroke="#0f1115" stroke-width="4"/>` : "";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">` +
    `<rect x="2" y="2" width="60" height="60" rx="14" fill="#1c2029" stroke="#7aa2f7" stroke-width="3"/>` +
    `<rect x="10" y="14" width="12" height="7" rx="2" fill="#7aa2f7"/>` +
    `<rect x="10" y="28" width="12" height="7" rx="2" fill="#7aa2f7" opacity=".55"/>` +
    `<rect x="10" y="42" width="12" height="7" rx="2" fill="#7aa2f7" opacity=".55"/>` +
    `<path d="M30 22l9 9-9 9" fill="none" stroke="#e6e9ef" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<path d="M43 44h11" stroke="#e6e9ef" stroke-width="5" stroke-linecap="round"/>${badge}</svg>`;
  const href = "data:image/svg+xml," + encodeURIComponent(svg);
  if ($("favicon").href !== href) $("favicon").href = href;
}

// ---------- rendering ----------
let dragId = null;        // the session tab being dragged; renders wait for the drop
let renderPending = false;

function render() {
  if (dragId) { renderPending = true; return; }
  const { sessions, external } = state;
  const needs = sessions.filter((s) => s.status === "needs-you").length;
  const ready = sessions.filter((s) => s.status === "ready").length;
  const working = sessions.filter((s) => s.status === "working" || s.status === "starting").length;
  $("summary").innerHTML =
    `<span class="n">${needs}</span> need you · <span class="n">${ready}</span> ready · <span class="n">${working}</span> working`;

  const waitingCount = sessions.filter(waiting).length;
  document.title = waitingCount ? `(${waitingCount}) claude-mux` : "claude-mux";
  favicon(needs ? "#f5b14c" : waitingCount ? "#4fd18b" : null);

  let html = `<div class="section">Running here</div>`;
  if (!sessions.length) html += `<div class="empty">None yet — ⌥N starts one.</div>`;
  html += renderRuns("s", grouped(sessions, (s) => s.group), (s, inGroup) => {
    const i = sessions.indexOf(s);
    const active = selected?.kind === "s" && selected.id === s.id;
    const cls = ["tab", inGroup && "in-group", active && "active", s.unseen && "unseen", s.status === "needs-you" && "needs-you"].filter(Boolean).join(" ");
    return `<div class="${cls}" data-kind="s" data-id="${esc(s.id)}" title="${esc(s.cwd)}" draggable="true">
      <span class="dot ${esc(s.status)}"></span>
      <span class="name">${star(s.claudeSessionId)}${esc(s.name)}</span>
      <span class="key">${i < 9 ? "⌥" + (i + 1) : ""}</span>
      <span class="sub">${esc(STATUS_TEXT[s.status] || s.status)} · ${ago(s.statusSince)} · ${esc(base(s.cwd))}</span>
    </div>`;
  }, groupDot);

  html += `<div class="section">Running in Terminal</div>`;
  if (!external.length) html += `<div class="empty">No claude running in other terminals.</div>`;
  for (const x of external) {
    const active = selected?.kind === "x" && selected.id === x.sessionId;
    html += `<div class="tab external ${active ? "active" : ""}" data-kind="x" data-id="${esc(x.sessionId)}" title="${esc(x.cwd)}">
      <span class="dot ext ${esc(x.status)}"></span>
      <span class="name">${star(x.sessionId)}${esc(x.name)}</span>
      <span class="key"></span>
      <span class="sub">${esc(x.status)}${x.title && x.title !== x.name ? " · " + esc(x.title) : ""} · ${esc(base(x.cwd))}</span>
    </div>`;
  }

  html += `<div class="section">Saved</div>`;
  const saved = idleSaved();
  if (!saved.length) html += `<div class="empty">Right-click a session → Save to keep it here.</div>`;
  html += renderRuns("f", grouped(saved, (f) => f.group), (f, inGroup) => {
    const active = selected?.kind === "f" && selected.id === f.claudeSessionId;
    return `<div class="tab ${inGroup ? "in-group" : ""} ${active ? "active" : ""}" data-kind="f" data-id="${esc(f.claudeSessionId)}" title="${esc(f.cwd)}">
      <span class="dot saved"></span>
      <span class="name">${f.onRestore ? `<span class="star" title="Restore message: ${esc(f.onRestore)}">↻</span> ` : ""}${esc(f.name)}</span>
      <span class="key"></span>
      <span class="sub">not running · ${esc(base(f.cwd))}</span>
    </div>`;
  });
  $("list").innerHTML = html;
  renderBar();
}

// The top bar's buttons are the context menu's actions, minus copying and
// the restore message, so the two never disagree.
function barActions(kind, id) {
  const items = menuItems(kind, id).filter((it) => it && !it[0].startsWith("copy-") && it[0] !== "restore-msg");
  return `<span class="actions">${items.map(([act, label, cls]) =>
    `<button data-act="${act}" class="${cls || ""}">${esc(label)}</button>`).join("")}</span>`;
}

function renderBar() {
  const bar = $("bar");
  if (!selected) { bar.innerHTML = `<span class="cwd">Pick a session on the left.</span>`; return; }
  if (selected.kind === "s") {
    const s = state.sessions.find((x) => x.id === selected.id);
    if (!s) return;
    bar.innerHTML = `
      <span class="title" title="Double-click to rename">${esc(s.name)}</span>
      <span class="pill ${esc(s.status)}">${esc(STATUS_TEXT[s.status] || s.status)}</span>
      <span class="cwd" title="${esc(s.cwd)}">${esc(s.cwd)}</span>
      ${barActions("s", s.id)}`;
  } else if (selected.kind === "f") {
    const f = state.favourites.find((x) => x.claudeSessionId === selected.id);
    if (!f) return;
    bar.innerHTML = `
      <span class="title">${esc(f.name)}</span>
      <span class="pill">saved · not running</span>
      <span class="cwd" title="${esc(f.cwd)}">${esc(f.cwd)}</span>
      ${barActions("f", f.claudeSessionId)}`;
  } else {
    const x = state.external.find((e) => e.sessionId === selected.id);
    const name = x ? x.name : "ended";
    bar.innerHTML = `
      <span class="title">${esc(name)}</span>
      <span class="pill">${x ? esc(x.status) : "not running"} · other terminal</span>
      <span class="cwd">${esc(x?.cwd || selected.cwd || "")}</span>
      ${x ? barActions("x", x.sessionId) : ""}`;
  }
}

// ---------- terminals ----------
function ensureTerm(id) {
  if (terms.has(id)) return terms.get(id);
  const el = document.createElement("div");
  el.className = "term";
  $("stage").appendChild(el);
  const term = new Terminal({
    fontFamily: '"JetBrains Mono", "SF Mono", Menlo, monospace',
    fontSize: 13,
    cursorBlink: true,
    allowProposedApi: true,
    scrollback: 20000,
    theme: termTheme(),
  });
  el.style.background = termTheme().background;
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.loadAddon(new WebLinksAddon.WebLinksAddon());
  term.open(el);
  const t = { term, fit, el, ws: null, closed: false, retry: 0 };

  // Shift+Enter: ESC CR, which Claude Code reads as a newline in the prompt.
  term.attachCustomKeyEventHandler((e) => {
    if (e.key === "Enter" && e.shiftKey) {
      if (e.type === "keydown") send(t, { t: "in", d: "\x1b\r" });
      return false;
    }
    return true;
  });
  term.onData((d) => send(t, { t: "in", d }));
  term.onResize(({ cols, rows }) => send(t, { t: "resize", c: cols, r: rows }));
  connect(id, t);
  terms.set(id, t);
  return t;
}

function send(t, msg) {
  if (t.ws && t.ws.readyState === WebSocket.OPEN) t.ws.send(JSON.stringify(msg));
}

function connect(id, t) {
  const ws = new WebSocket(`ws://${location.host}/api/sessions/${encodeURIComponent(id)}/term`);
  ws.binaryType = "arraybuffer";
  t.ws = ws;
  ws.onopen = () => {
    t.retry = 0;
    t.term.reset(); // the server replays its scrollback first
    send(t, { t: "resize", c: t.term.cols, r: t.term.rows });
  };
  ws.onmessage = (e) => t.term.write(new Uint8Array(e.data));
  ws.onclose = () => {
    if (t.closed) return;
    t.retry = Math.min(t.retry + 1, 6);
    setTimeout(() => { if (!t.closed && state.sessions.some((s) => s.id === id)) connect(id, t); }, 500 * t.retry);
  };
}

function dropTerm(id) {
  const t = terms.get(id);
  if (!t) return;
  t.closed = true;
  t.ws?.close();
  t.term.dispose();
  t.el.remove();
  terms.delete(id);
}

function fitSelected() {
  if (selected?.kind !== "s") return;
  const t = terms.get(selected.id);
  if (t) { t.fit.fit(); }
}

// Assistant text is Markdown; DOMPurify strips anything a transcript could smuggle in.
function markdown(text) {
  if (typeof marked === "undefined" || typeof DOMPurify === "undefined") return `<div style="white-space:pre-wrap">${esc(text)}</div>`;
  return DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: false }));
}

// ---------- selection ----------
function select(kind, id, extra = {}) {
  selected = { kind, id, ...extra };
  const g = kind === "s" ? state.sessions.find((s) => s.id === id)?.group : kind === "f" ? favourite(id)?.group : "";
  if (g) setCollapsed(kind + ":" + g, false);
  store.set("mux.selected", JSON.stringify({ kind, id }));
  for (const [tid, t] of terms) t.el.classList.toggle("shown", kind === "s" && tid === id);
  $("placeholder").style.display = "none";
  $("transcript").classList.toggle("shown", kind === "x" || kind === "f");
  $("composer").classList.toggle("shown", kind === "x");
  $("cHint").textContent = "";
  clearInterval(transcriptTimer);

  if (kind === "s") {
    const t = ensureTerm(id);
    t.el.classList.add("shown");
    requestAnimationFrame(() => { fitSelected(); t.term.focus(); });
    markSeen(id);
  } else if (kind === "x") {
    loadTranscript(id);
    $("cText").focus();
    transcriptTimer = setInterval(() => loadTranscript(id), 4000);
  } else {
    loadTranscript(id);
  }
  render();
}

function markSeen(id) {
  const s = state.sessions.find((x) => x.id === id);
  if (s?.unseen && document.visibilityState === "visible") api("POST", `/api/sessions/${id}/seen`).catch(() => {});
}

async function loadTranscript(sid) {
  const box = $("transcript");
  try {
    const entries = await api("GET", `/api/transcript/${encodeURIComponent(sid)}`);
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
    const note = selected?.kind === "f"
      ? `Saved, not running — its last ${entries.length} messages. <b>Open here</b> or <b>Open in Terminal</b> continues it.`
      : `Running in another terminal — last ${entries.length} messages, refreshed every few seconds. Messages you send below are typed into that window. <b>Move here</b> ends it there and continues it here.`;
    box.innerHTML = `<div class="note">${note}</div>` +
      entries.map((e) => e.role === "tool"
        ? `<div class="msg tool">→ ${esc(e.text)}</div>`
        : `<div class="msg ${e.role}"><div class="who">${e.role === "user" ? "you" : "claude"}</div>${
            e.role === "user" ? `<div class="body">${esc(e.text)}</div>` : `<div class="body md">${markdown(e.text)}</div>`}</div>`).join("");
    if (atBottom) box.scrollTop = box.scrollHeight;
  } catch (err) {
    box.innerHTML = `<div class="note">No transcript: ${esc(err.message)}</div>`;
  }
}

function ordered() {
  return [
    ...state.sessions.map((s) => ({ kind: "s", id: s.id })),
    ...state.external.map((x) => ({ kind: "x", id: x.sessionId })),
    ...idleSaved().map((f) => ({ kind: "f", id: f.claudeSessionId })),
  ];
}

function step(dir) {
  const all = ordered();
  if (!all.length) return;
  const i = all.findIndex((t) => selected && t.kind === selected.kind && t.id === selected.id);
  const next = all[(i + dir + all.length) % all.length];
  select(next.kind, next.id);
}

// ⌥J: the next session that waits for you, permission prompts first.
function jumpWaiting() {
  const list = state.sessions;
  const start = Math.max(0, list.findIndex((s) => selected?.kind === "s" && s.id === selected.id));
  const rot = [...list.slice(start + 1), ...list.slice(0, start + 1)];
  const next = rot.find((s) => s.status === "needs-you") || rot.find((s) => s.status === "ready" && s.unseen);
  if (next) select("s", next.id);
}

// ---------- notifications ----------
function notifyTransitions() {
  for (const s of state.sessions) {
    const prev = lastStatus.get(s.id);
    lastStatus.set(s.id, s.status);
    if (!prev || prev === s.status) continue;
    if (s.status === "starting" || prev === "exited" || prev === "stopped") {
      const t = terms.get(s.id);
      if (t && t.ws?.readyState !== WebSocket.OPEN) { t.retry = 0; connect(s.id, t); }
    }
    if (s.status !== "ready" && s.status !== "needs-you") continue;
    const looking = document.visibilityState === "visible" && document.hasFocus() && selected?.kind === "s" && selected.id === s.id;
    if (looking || typeof Notification === "undefined" || Notification.permission !== "granted") continue;
    const n = new Notification(s.name, { body: s.status === "needs-you" ? "needs you" : "ready for input", tag: s.id });
    n.onclick = () => { window.focus(); select("s", s.id); n.close(); };
  }
}

function updateNotifyButton() {
  const b = $("notify");
  b.hidden = typeof Notification === "undefined" || Notification.permission !== "default";
}

// ---------- state stream ----------
function applyState(next) {
  state = { ...next, sessions: next.sessions || [], external: next.external || [], favourites: next.favourites || [] };
  for (const id of [...terms.keys()]) if (!state.sessions.some((s) => s.id === id)) dropTerm(id);
  if (selected?.kind === "s" && !state.sessions.some((s) => s.id === selected.id)) {
    selected = null;
    $("placeholder").style.display = "";
  }
  // A saved conversation that just started: follow it to where it now runs.
  if (selected?.kind === "f" && !idleSaved().some((f) => f.claudeSessionId === selected.id)) {
    const s = state.sessions.find((x) => x.claudeSessionId === selected.id);
    const x = state.external.find((e) => e.sessionId === selected.id);
    if (s) select("s", s.id);
    else if (x) select("x", x.sessionId, { cwd: x.cwd });
  }
  notifyTransitions();
  if (selected?.kind === "s") markSeen(selected.id);
  render();
}

function stream() {
  const es = new EventSource("/api/events");
  es.onmessage = (e) => applyState(JSON.parse(e.data));
  es.onerror = () => { $("summary").textContent = "server unreachable — retrying…"; };
}

// ---------- actions ----------
function openNew(prefill = {}) {
  const cwds = new Set([state.defaultCwd, ...state.sessions.map((s) => s.cwd), ...state.external.map((x) => x.cwd)]);
  $("cwds").innerHTML = [...cwds].filter(Boolean).map((c) => `<option value="${esc(c)}">`).join("");
  $("groups").innerHTML = allGroups().map((g) => `<option value="${esc(g)}">`).join("");
  $("fName").value = prefill.name || "";
  $("fGroup").value = prefill.group ?? (selected?.kind === "s" ? state.sessions.find((s) => s.id === selected.id)?.group || "" : "");
  $("fCwd").value = prefill.cwd || store.get("mux.lastCwd") || state.defaultCwd;
  $("fArgs").value = store.get("mux.lastArgs") || "";
  $("fSkip").checked = store.get("mux.skip") === "1";
  $("fChrome").checked = store.get("mux.chrome") === "1";
  $("dlgErr").textContent = "";
  $("dlg").showModal();
  $("fName").focus();
}

$("dlgForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const flags = [$("fSkip").checked && "--dangerously-skip-permissions", $("fChrome").checked && "--chrome"].filter(Boolean);
  const body = { name: $("fName").value, group: $("fGroup").value, cwd: $("fCwd").value, args: [...flags, $("fArgs").value].join(" ") };
  try {
    const s = await api("POST", "/api/sessions", body);
    store.set("mux.lastCwd", body.cwd);
    store.set("mux.lastArgs", $("fArgs").value);
    store.set("mux.skip", $("fSkip").checked ? "1" : "0");
    store.set("mux.chrome", $("fChrome").checked ? "1" : "0");
    $("dlg").close();
    state.sessions = [...state.sessions.filter((x) => x.id !== s.id), s];
    select("s", s.id);
  } catch (err) {
    $("dlgErr").textContent = err.message;
  }
});
// The message box grows with its text; Enter sends, Shift+Enter breaks the line.
function sizeComposer() {
  const t = $("cText");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 160) + "px";
  document.body.style.setProperty("--composer-h", $("composer").offsetHeight + "px");
}
$("cText").addEventListener("input", sizeComposer);
$("cText").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    $("composer").requestSubmit();
  }
});

$("composer").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (selected?.kind !== "x") return;
  const text = $("cText").value.replace(/\s+$/, "");
  if (!text) return;
  const sid = selected.id;
  $("cHint").textContent = "sending…";
  try {
    await api("POST", `/api/external/${encodeURIComponent(sid)}/send`, { text });
    $("cText").value = "";
    sizeComposer();
    $("cHint").textContent = "sent";
    setTimeout(() => loadTranscript(sid), 1500);
  } catch (err) {
    $("cHint").textContent = err.message;
  }
});
$("dlgCancel").onclick = () => $("dlg").close();
$("new").onclick = () => openNew();
$("new2").onclick = () => openNew();
$("notify").onclick = async () => { await Notification.requestPermission(); updateNotifyButton(); };

$("list").addEventListener("click", (e) => {
  const head = e.target.closest(".group");
  if (head) {
    const key = head.dataset.kind + ":" + head.dataset.group;
    setCollapsed(key, !collapsed.has(key));
    render();
    return;
  }
  const tab = e.target.closest(".tab");
  if (!tab) return;
  const extra = tab.dataset.kind === "x" ? { cwd: state.external.find((x) => x.sessionId === tab.dataset.id)?.cwd } : {};
  select(tab.dataset.kind, tab.dataset.id, extra);
});

// Drag a session tab to reorder; the server keeps the order.
function dropSide(tab, e) {
  const r = tab.getBoundingClientRect();
  return e.clientY < r.top + r.height / 2 ? "before" : "after";
}
function clearDrop() {
  for (const t of $("list").querySelectorAll(".drop-before, .drop-after, .drop-into")) t.classList.remove("drop-before", "drop-after", "drop-into");
}
$("list").addEventListener("dragstart", (e) => {
  const tab = e.target.closest('.tab[data-kind="s"]');
  if (!tab) return;
  dragId = tab.dataset.id;
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", dragId);
  tab.classList.add("dragging");
});
// Dropped on a tab, a tab takes that tab's group; dropped on a group's header,
// it joins the group at its end.
$("list").addEventListener("dragover", (e) => {
  const tab = e.target.closest('.tab[data-kind="s"], .group[data-kind="s"]');
  if (!dragId || !tab) return;
  e.preventDefault();
  clearDrop();
  if (tab.classList.contains("group")) tab.classList.add("drop-into");
  else if (tab.dataset.id !== dragId) tab.classList.add("drop-" + dropSide(tab, e));
});
$("list").addEventListener("drop", async (e) => {
  const tab = e.target.closest('.tab[data-kind="s"], .group[data-kind="s"]');
  if (!dragId || !tab || tab.dataset.id === dragId) return;
  e.preventDefault();
  const id = dragId;
  const ids = state.sessions.map((s) => s.id).filter((x) => x !== id);
  let group;
  if (tab.classList.contains("group")) {
    group = tab.dataset.group;
    const last = state.sessions.filter((s) => s.group === group && s.id !== id).pop();
    ids.splice(last ? ids.indexOf(last.id) + 1 : ids.length, 0, id);
  } else {
    group = state.sessions.find((s) => s.id === tab.dataset.id)?.group || "";
    ids.splice(ids.indexOf(tab.dataset.id) + (dropSide(tab, e) === "after" ? 1 : 0), 0, id);
  }
  const moved = state.sessions.find((s) => s.id === id);
  const regroup = (moved.group || "") !== group;
  state.sessions = ids.map((x) => state.sessions.find((s) => s.id === x));
  moved.group = group;
  try {
    if (regroup) await api("PUT", `/api/sessions/${id}/group`, { group });
    await api("PUT", "/api/sessions/order", { ids });
  } catch (err) {
    alert(err.message);
  }
});
$("list").addEventListener("dragend", () => {
  dragId = null;
  renderPending = false;
  clearDrop();
  render();
});

// Right-click a tab for its actions.
function menuItems(kind, id) {
  const save = (sid) => sid && (isSaved(sid) ? ["unsave", "Unsave"] : ["save", "★ Save"]);
  const restore = (sid) => isSaved(sid) && ["restore-msg", "Restore message…"];
  const copy = (sid) => [sid && ["copy-id", "Copy session id"], ["copy-cwd", "Copy directory"]];
  let items;
  if (kind === "g") {
    items = [["new-in-group", "New session in group…"], ["rename-group", "Rename group…"], null, ["ungroup", "Ungroup"]];
  } else if (kind === "f") {
    items = [["open-here", "Open here"], ["open-terminal", "Open in Terminal"], ["group", "Group…"], restore(id), null, ...copy(id), null, ["unsave", "Remove from saved", "danger"]];
  } else if (kind === "x") {
    items = [["rename", "Rename…"], ["takeover", "Move here"], save(id), restore(id), null, ...copy(id), null, ["close-ext", "Close", "danger"]];
  } else {
    const s = state.sessions.find((x) => x.id === id);
    if (!s) return [];
    const dead = s.status === "exited" || s.status === "stopped";
    items = [
      ["rename", "Rename…"],
      ["group", "Group…"],
      dead && s.claudeSessionId && ["resume", "Resume"],
      s.claudeSessionId && ["handoff", "Move to Terminal"],
      save(s.claudeSessionId),
      restore(s.claudeSessionId),
      null,
      ...copy(s.claudeSessionId),
      null,
      ["close", "Close", "danger"],
    ];
  }
  return items.filter((x) => x !== false && x !== undefined && x !== "");
}

function closeMenu() { $("menu").classList.remove("open"); }

$("list").addEventListener("contextmenu", (e) => {
  const tab = e.target.closest(".tab, .group");
  if (!tab) return;
  e.preventDefault();
  const target = tab.classList.contains("group") ? { kind: "g", id: tab.dataset.group } : { kind: tab.dataset.kind, id: tab.dataset.id };
  const menu = $("menu");
  menu.innerHTML = menuItems(target.kind, target.id)
    .map((it) => it ? `<button data-act="${it[0]}" class="${it[2] || ""}">${esc(it[1])}</button>` : "<hr>").join("");
  menu.onclick = (ev) => {
    const b = ev.target.closest("button[data-act]");
    if (!b) return;
    closeMenu();
    act(b.dataset.act, target);
  };
  menu.classList.add("open");
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.min(e.clientX, innerWidth - r.width - 8) + "px";
  menu.style.top = Math.min(e.clientY, innerHeight - r.height - 8) + "px";
});
window.addEventListener("pointerdown", (e) => { if (!e.target.closest("#menu")) closeMenu(); }, true);
window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });
window.addEventListener("blur", closeMenu);

$("bar").addEventListener("dblclick", (e) => { if (e.target.classList.contains("title")) act("rename"); });
$("bar").addEventListener("click", (e) => { const b = e.target.closest("button[data-act]"); if (b) act(b.dataset.act); });

// act runs one action on a tab: the selected one (the top bar) or the one
// right-clicked (the context menu).
async function act(what, target = selected) {
  if (!target) return;
  const id = target.id;
  try {
    if (what === "rename") {
      // Claude renames itself (/rename); the sidebar shows the name it reports, within a few seconds.
      const cur = target.kind === "s" ? state.sessions.find((x) => x.id === id)?.name : state.external.find((x) => x.sessionId === id)?.name;
      const name = prompt("Rename session (sent to claude as /rename; an unsent draft in its prompt is cleared)", cur || "");
      if (name && name.trim()) {
        if (target.kind === "s") await api("PATCH", `/api/sessions/${id}`, { name: name.trim() });
        else await api("POST", `/api/external/${encodeURIComponent(id)}/rename`, { name: name.trim() });
      }
    } else if (what === "group") {
      const cur = target.kind === "s" ? state.sessions.find((x) => x.id === id)?.group : favourite(id)?.group;
      const group = await askGroup("Group", "Tabs with the same group sit together under one header. Empty takes it out of its group.", cur || "");
      if (group === null) return;
      if (target.kind === "s") await api("PUT", `/api/sessions/${id}/group`, { group });
      else await api("PUT", `/api/favourites/${encodeURIComponent(id)}`, { ...favourite(id), group });
    } else if (what === "rename-group") {
      const to = await askGroup("Rename group", "Renames it on every tab and saved conversation; an existing group's name merges the two.", id);
      if (to && to !== id) await api("POST", "/api/groups/rename", { from: id, to });
    } else if (what === "ungroup") {
      await api("POST", "/api/groups/rename", { from: id, to: "" });
    } else if (what === "new-in-group") {
      openNew({ group: id });
    } else if (what === "handoff") {
      await api("POST", `/api/sessions/${id}/handoff`);
    } else if (what === "resume") {
      await api("POST", `/api/sessions/${id}/resume`);
      terms.get(id)?.term.focus();
    } else if (what === "close") {
      const s = state.sessions.find((x) => x.id === id);
      if (s?.status !== "working" || confirm("It is working — close it anyway? The turn in progress is cut off.")) await api("DELETE", `/api/sessions/${id}`);
    } else if (what === "close-ext") {
      const x = state.external.find((e) => e.sessionId === id);
      if (x?.status !== "busy" || confirm("It is working — close it anyway? The turn in progress is cut off.")) await api("DELETE", `/api/external/${encodeURIComponent(id)}`);
    } else if (what === "save" || what === "unsave") {
      const s = target.kind === "s" ? state.sessions.find((x) => x.id === id) : null;
      const x = target.kind === "x" ? state.external.find((e) => e.sessionId === id) : null;
      const sid = s ? s.claudeSessionId : id;
      if (what === "unsave") await api("DELETE", `/api/favourites/${encodeURIComponent(sid)}`);
      else await api("PUT", `/api/favourites/${encodeURIComponent(sid)}`, s
        ? { name: s.name, group: s.group || "", cwd: s.cwd, args: s.args || [] }
        : { name: x?.title || x?.name || "", cwd: x?.cwd || "", args: [] });
    } else if (what === "restore-msg") {
      const sid = target.kind === "s" ? state.sessions.find((x) => x.id === id)?.claudeSessionId : id;
      const f = favourite(sid);
      if (!f) return;
      $("rText").value = f.onRestore || "";
      $("restoreForm").onsubmit = async (e) => {
        e.preventDefault();
        $("restoreDlg").close();
        await api("PUT", `/api/favourites/${encodeURIComponent(sid)}`, { ...f, onRestore: $("rText").value.trim() }).catch((err) => alert(err.message));
      };
      $("rCancel").onclick = () => $("restoreDlg").close();
      $("restoreDlg").showModal();
      $("rText").focus();
    } else if (what === "open-here") {
      const s = await api("POST", `/api/favourites/${encodeURIComponent(id)}/start`);
      state.sessions = [...state.sessions, s];
      select("s", s.id);
    } else if (what === "open-terminal") {
      await api("POST", `/api/favourites/${encodeURIComponent(id)}/terminal`);
    } else if (what === "takeover") {
      const x = state.external.find((e) => e.sessionId === id);
      const busy = x?.status === "busy" ? "\n\nIt is busy: the turn in progress will be cut off." : "";
      if (x && !confirm(`End this session in its terminal (pid ${x.pid}) and continue it here? The window stays open.${busy}`)) return;
      const s = await api("POST", `/api/external/${encodeURIComponent(id)}/takeover`, { name: x?.title || x?.name || "", cwd: x?.cwd || target.cwd || "" });
      state.sessions = [...state.sessions, s];
      select("s", s.id);
    } else if (what === "copy-id" || what === "copy-cwd") {
      const t = target.kind === "s" ? state.sessions.find((x) => x.id === id)
        : target.kind === "f" ? state.favourites.find((f) => f.claudeSessionId === id)
        : state.external.find((x) => x.sessionId === id);
      const text = what === "copy-cwd" ? t?.cwd : target.kind === "s" ? t?.claudeSessionId : id;
      if (text) await navigator.clipboard.writeText(text);
    }
  } catch (err) {
    alert(err.message);
  }
}

// askGroup asks for a group name, offering the existing ones; null when cancelled.
function askGroup(title, hint, value) {
  $("groups").innerHTML = allGroups().map((g) => `<option value="${esc(g)}">`).join("");
  $("gTitle").textContent = title;
  $("gHint").textContent = hint;
  $("gName").value = value;
  return new Promise((resolve) => {
    const done = (v) => { $("groupDlg").close(); resolve(v); };
    $("groupForm").onsubmit = (e) => { e.preventDefault(); done($("gName").value.trim()); };
    $("gCancel").onclick = () => done(null);
    $("groupDlg").oncancel = () => resolve(null);
    $("groupDlg").showModal();
    $("gName").select();
  });
}

// Shortcuts are caught before the terminal sees them.
window.addEventListener("keydown", (e) => {
  if (!e.altKey || e.metaKey || e.ctrlKey) return;
  let handled = true;
  if (/^Digit[1-9]$/.test(e.code)) {
    const s = state.sessions[Number(e.code.slice(5)) - 1];
    if (s) select("s", s.id);
  } else if (e.code === "KeyN") openNew();
  else if (e.code === "KeyJ") jumpWaiting();
  else if (e.code === "ArrowUp") step(-1);
  else if (e.code === "ArrowDown") step(1);
  else handled = false;
  if (handled) { e.preventDefault(); e.stopPropagation(); }
}, true);

// The sidebar's right edge drags to resize it; the width is kept per browser.
function setSide(px) {
  const w = Math.min(600, Math.max(180, Math.round(px)));
  document.body.style.setProperty("--side", w + "px");
  return w;
}
{
  const saved = Number(store.get("mux.side"));
  if (saved) setSide(saved);
  const grip = $("grip");
  grip.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    grip.setPointerCapture(e.pointerId);
    grip.classList.add("dragging");
    document.body.classList.add("resizing");
  });
  grip.addEventListener("pointermove", (e) => {
    if (grip.hasPointerCapture(e.pointerId)) setSide(e.clientX);
  });
  grip.addEventListener("pointerup", (e) => {
    grip.releasePointerCapture(e.pointerId);
    grip.classList.remove("dragging");
    document.body.classList.remove("resizing");
    store.set("mux.side", String(setSide(e.clientX)));
    fitSelected();
  });
  grip.addEventListener("dblclick", () => { setSide(270); store.set("mux.side", "270"); fitSelected(); });
}

window.addEventListener("resize", fitSelected);
new ResizeObserver(fitSelected).observe($("stage"));
document.addEventListener("visibilitychange", () => { if (selected?.kind === "s") markSeen(selected.id); });
window.addEventListener("focus", () => { if (selected?.kind === "s") markSeen(selected.id); });
setInterval(render, 15000); // keep the "3m ago" labels moving

// ---------- boot ----------
(async () => {
  updateNotifyButton();
  try {
    applyState(await api("GET", "/api/state"));
    const saved = JSON.parse(store.get("mux.selected") || "null");
    if (saved?.kind === "s" && state.sessions.some((s) => s.id === saved.id)) select("s", saved.id);
  } catch {}
  stream();
})();
</script>
