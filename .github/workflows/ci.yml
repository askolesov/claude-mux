name: CI

on:
  push:
    branches: [main]
  pull_request:

# scripts/check.sh runs the same checks locally.
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # Without cgo the hub builds without its window (the mac and windows
      # jobs build it with one); everything else is the same.
      - run: CGO_ENABLED=0 go vet ./...
      - run: CGO_ENABLED=0 GOOS=windows go vet ./...
      - run: CGO_ENABLED=0 GOOS=darwin go vet ./...
      - run: CGO_ENABLED=0 go test ./...
      # The race detector needs cgo, which the window's packages would need
      # WebKitGTK for; the internals have none of it.
      - run: CGO_ENABLED=1 go test -race ./internal/...

  lint:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - run: GOOS=windows golangci-lint run ./...
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint

  # The app's window, menus and native paths are cgo; build and test them
  # on a Mac, so a break shows here and not at release.
  mac:
    runs-on: macos-latest
    env:
      CGO_ENABLED: "1"
      CGO_CXXFLAGS: -Wno-deprecated-literal-operator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build -o /dev/null ./cmd/hub
      - run: go test -race ./...

  # The Windows window code (cgo, WebView2) is first built here, not at
  # release.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./cmd/...
      - run: go build -o /dev/null ./cmd/hub
      - run: go test ./cmd/...
      # The window's files for Windows and Linux (cgo, !darwin) are linted
      # only here.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
