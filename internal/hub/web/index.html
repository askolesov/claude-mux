<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-mux</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="style.css">
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="vendor/addon-web-links.js"></script>
</head>
<body>
<aside>
  <div class="grip" id="grip" title="Drag to resize · double-click to reset"></div>
  <div class="brand">
    <span id="mark1"></span>
    <span class="title">claude-mux</span>
    <button class="icon-btn" id="new" title="New tab (⌥N)" aria-label="New tab"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="icon-btn" id="settings" title="Settings (⌘,)" aria-label="Settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></button>
  </div>
  <button class="jump" id="jump"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Jump to tab</span><kbd id="jumpKey">⌘K</kbd></button>
  <div class="list" id="list"></div>
  <div class="updatebar" id="updatebar" hidden></div>
</aside>
<div class="strip" id="strip"></div>
<main>
  <div class="head" id="head"></div>
  <div class="stage" id="stage">
    <div class="placeholder" id="placeholder">
      <div><p>No tab selected.</p><p><button class="btn primary" id="new2">New tab</button></p></div>
    </div>
  </div>
</main>

<div class="menu" id="menu"></div>

<!-- Settings: a page over the tabs, with sections on the left. -->
<div class="settings" id="settingsPage">
  <header>
    <button class="back" id="sBack"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Back to tabs</button>
    <h1>Settings</h1>
  </header>
  <div class="sbody">
    <nav id="sNav"></nav>
    <div class="content"><div id="sContent"></div></div>
  </div>
</div>

<!-- Quick switcher -->
<div class="palette" id="palette">
  <div class="box">
    <label><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="pIn" placeholder="Jump to a tab, or type > for actions" aria-label="Search tabs and actions" autocomplete="off"><kbd>esc</kbd></label>
    <div class="items" id="pItems"></div>
    <div class="foot"><span>↑↓ move</span><span>↵ open</span><span style="flex:1"></span><span>Waiting tabs first</span></div>
  </div>
</div>

<datalist id="groupsList"></datalist>
<datalist id="cwds"></datalist>
<datalist id="targets"></datalist>

<!-- Tab settings, and New tab, which shares its fields. -->
<dialog id="tabDlg">
  <form method="dialog" id="tabForm">
    <div class="dhead" style="padding:0 0 4px">
      <div class="dtitle"><h3 id="tTitle"></h3><div class="dmeta" id="tMeta"></div></div>
      <button type="button" class="icon-btn" id="tX" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <label class="field" id="tEnvRow">Environment<select id="tEnv"></select></label>
    <label class="field">Name<input id="tName" autocomplete="off"><span class="hint" id="tNameHint"></span></label>
    <label class="field">Group<select id="tGroup"></select></label>
    <label class="field" id="tNewGroupRow" hidden>New group<input id="tNewGroup" autocomplete="off"></label>
    <label class="field">Directory<input id="tCwd" class="mono-in" list="cwds" autocomplete="off"></label>
    <div class="field">When it starts again
      <div><span class="seg" id="tResume"></span></div>
      <textarea id="tResumeMsg" rows="3" style="margin-top:6px"></textarea>
      <span class="hint" id="tResumeHint"></span>
    </div>
    <div class="field">Extra arguments
      <input id="tArgs" class="mono-in" placeholder="e.g. --model sonnet --add-dir ../shared" autocomplete="off">
      <div class="checks" id="tChecks"></div>
      <div class="cmd" id="tCmd"></div>
    </div>
    <div class="err" id="tErr"></div>
    <div class="dfoot" style="padding:12px 0 0">
      <button type="button" class="btn danger" id="tClose">Close tab</button>
      <button type="button" class="btn" id="tRestart">Restart</button>
      <span class="gap"></span>
      <button type="button" class="btn" id="tCancel">Cancel</button>
      <button class="btn primary" id="tOk">Save</button>
    </div>
  </form>
</dialog>

<dialog id="msgDlg">
  <form method="dialog" id="msgForm">
    <h3 id="mTitle"></h3>
    <div class="note" id="mText" style="color:var(--text2)"></div>
    <div class="dfoot" style="padding:14px 0 0"><span class="gap"></span><button type="button" class="btn" id="mCancel">Cancel</button><button class="btn primary" id="mOk">OK</button></div>
  </form>
</dialog>

<dialog id="askDlg">
  <form method="dialog" id="askForm">
    <h3 id="aTitle"></h3>
    <div class="note" id="aHint"></div>
    <input id="aLine" class="input" list="groupsList" autocomplete="off">
    <div class="dfoot" style="padding:14px 0 0"><span class="gap"></span><button type="button" class="btn" id="aCancel">Cancel</button><button class="btn primary">Save</button></div>
  </form>
</dialog>

<dialog id="hostDlg">
  <form method="dialog" id="hostForm">
    <h3>Add an environment</h3>
    <label class="field">Kind<select id="hKind"></select></label>
    <label class="field"><span id="hHint"></span><input id="hHost" class="mono-in" list="targets" autocomplete="off"></label>
    <label class="field">Name<input id="hName" placeholder="defaults to the host" autocomplete="off"></label>
    <div class="err" id="hostErr"></div>
    <div class="dfoot" style="padding:14px 0 0"><span class="gap"></span><button type="button" class="btn" id="hostCancel">Cancel</button><button class="btn primary">Add</button></div>
  </form>
</dialog>

<dialog id="installDlg">
  <div class="body">
    <h3 id="iTitle"></h3>
    <div class="note">Runs Anthropic's official installer there:</div>
    <code id="iCmd"></code>
    <div class="note" id="iState"></div>
    <pre id="iOut" hidden></pre>
    <div class="dfoot" style="padding:14px 0 0"><span class="gap"></span><button type="button" class="btn" id="iClose">Cancel</button><button class="btn primary" id="iRun">Install</button></div>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
