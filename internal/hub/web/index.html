<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-mux</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='14' fill='%231c2029' stroke='%237aa2f7' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161920;
    --panel-2: #1c2029;
    --line: #262b36;
    --text: #d7dae0;
    --muted: #7d8494;
    --accent: #7aa2f7;
    --working: #7aa2f7;
    --ready: #4fd18b;
    --needs: #f5b14c;
    --dead: #5b6170;
    --danger: #f16c6c;
    --on-accent: #0f1115;
    --mono: "JetBrains Mono", "SF Mono", Menlo, monospace;
  }
  /* Light: chosen in the footer, or Auto on a light system. */
  :root[data-theme="light"] {
    --bg: #ffffff;
    --panel: #f6f7f9;
    --panel-2: #eceef2;
    --line: #d9dde4;
    --text: #1d2129;
    --muted: #646c7c;
    --accent: #2f5fd0;
    --on-accent: #ffffff;
    --working: #2f5fd0;
    --ready: #1f9d5c;
    --needs: #c27a10;
    --dead: #9aa1ad;
    --danger: #d64545;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
    --bg: #ffffff;
      --panel: #f6f7f9;
      --panel-2: #eceef2;
      --line: #d9dde4;
      --text: #1d2129;
      --muted: #646c7c;
      --accent: #2f5fd0;
      --on-accent: #ffffff;
      --working: #2f5fd0;
      --ready: #1f9d5c;
      --needs: #c27a10;
      --dead: #9aa1ad;
      --danger: #d64545;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: grid; grid-template-columns: var(--side, 270px) 1fr; overflow: hidden;
  }
  button {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }

  /* sidebar */
  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0; min-width: 0; position: relative;
  }
  .grip { position: absolute; top: 0; right: -4px; width: 8px; height: 100%; cursor: col-resize; z-index: 5; touch-action: none; }
  .grip:hover, .grip.dragging { background: linear-gradient(to right, transparent 3px, var(--accent) 3px, var(--accent) 5px, transparent 5px); }
  body.resizing { cursor: col-resize; user-select: none; }
  .brand { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 8px; }
  .brand .row { display: flex; gap: 6px; }
  .brand b { font-family: var(--mono); font-size: 14px; letter-spacing: .02em; }
  .summary { padding: 0 12px 8px; color: var(--muted); font-size: 12px; }
  .summary .n { color: var(--text); font-weight: 600; }
  .list { flex: 1; overflow-y: auto; padding-bottom: 8px; }
  .tab {
    display: grid; grid-template-columns: 14px 1fr auto; gap: 2px 8px; align-items: center;
    padding: 7px 12px; margin: 1px 6px; border-radius: 6px; cursor: pointer; border: 1px solid transparent;
  }
  .tab:hover { background: var(--panel-2); }
  .tab.active { background: var(--panel-2); border-color: var(--line); }
  .tab .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab.unseen .name { font-weight: 700; }
  .tab .key { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .tab .sub { grid-column: 2 / 4; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab.unseen { box-shadow: inset 3px 0 0 var(--ready); }
  .tab.needs-you { box-shadow: inset 3px 0 0 var(--needs); }
  .tab.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  .tab.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
  .tab.dragging { opacity: .4; }
  .mark { color: var(--needs); }
  .empty { padding: 4px 18px; color: var(--muted); font-size: 12px; }
  .group {
    display: flex; align-items: center; gap: 6px; padding: 5px 12px; margin: 4px 6px 1px; border-radius: 6px;
    cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 600; user-select: none; border: 1px solid transparent;
  }
  .group:hover { background: var(--panel-2); color: var(--text); }
  .group .caret { width: 10px; font-size: 10px; }
  .group .gname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .group .gcount { font-weight: 400; font-size: 11px; }
  .group .dot { width: 8px; height: 8px; margin-left: auto; }
  .group.drop-into { border-color: var(--accent); }
  .tab.in-group { margin-left: 18px; }
  .env {
    display: flex; align-items: center; gap: 7px; padding: 12px 12px 4px; font-size: 12px; color: var(--text);
    border-top: 1px solid var(--line); margin-top: 6px; cursor: default;
  }
  .env:first-child { border-top: 0; margin-top: 0; }
  .env .where { color: var(--muted); font-family: var(--mono); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .env .estate { margin-left: auto; color: var(--muted); font-size: 11px; }
  .env .dot { width: 8px; height: 8px; }
  .dot.env-connected { background: var(--ready); }
  .dot.env-connecting { background: var(--muted); animation: pulse 1.2s ease-in-out infinite; }
  .dot.env-failed { background: var(--danger); }
  .notice { margin: 4px 12px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; color: var(--muted); }
  .notice.err { color: var(--danger); word-break: break-word; }
  .notice .row { display: flex; gap: 6px; margin-top: 6px; }

  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dead); justify-self: center; }
  .dot.working { background: var(--working); animation: pulse 1.2s ease-in-out infinite; }
  .dot.starting { background: var(--muted); animation: pulse 1.2s ease-in-out infinite; }
  .dot.ready { background: var(--ready); }
  .dot.needs-you { background: var(--needs); animation: pulse .8s ease-in-out infinite; }
  .dot.exited, .dot.stopped { background: transparent; border: 2px solid var(--dead); }
  @keyframes pulse { 50% { opacity: .35; } }

  .foot { border-top: 1px solid var(--line); padding: 8px 12px; color: var(--muted); font-size: 11px; line-height: 1.7; }
  .foot kbd { font-family: var(--mono); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--text); }
  .foot button { margin-top: 6px; font-size: 11px; padding: 2px 8px; }
  .prefs { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
  .prefs label { display: flex; align-items: center; gap: 4px; }
  .prefs select { font: 11px inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 4px; }

  /* main */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .bar {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    border-bottom: 1px solid var(--line); background: var(--panel); min-height: 45px;
  }
  .bar .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .cwd { color: var(--muted); font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill.ready { color: var(--ready); border-color: var(--ready); }
  .pill.needs-you { color: var(--needs); border-color: var(--needs); }
  .pill.working { color: var(--working); border-color: var(--working); }
  .bar .actions { display: flex; gap: 6px; }
  .stage { flex: 1; position: relative; min-height: 0; }
  .term { position: absolute; inset: 0; padding: 6px 0 0 10px; display: none; background: var(--bg); }
  .term.shown { display: block; }
  .placeholder { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; }
  .placeholder p { margin: 6px 0; }

  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; width: min(460px, 92vw);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .5); }

  .menu {
    position: fixed; z-index: 50; min-width: 190px; padding: 4px; display: none;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
  }
  .menu.open { display: block; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; border-radius: 5px; padding: 6px 10px; }
  .menu button:hover { background: var(--line); }
  .menu button.danger:hover { color: var(--danger); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
  dialog h3 { margin: 0 0 12px; font-size: 15px; }
  dialog label { display: block; color: var(--muted); font-size: 12px; margin: 10px 0 4px; }
  dialog input {
    width: 100%; font: 13px var(--mono); color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px;
  }
  dialog input:focus { outline: none; border-color: var(--accent); }
  dialog .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  dialog .checks { display: flex; gap: 18px; margin-top: 12px; }
  dialog .checks label { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--text); font: 12px var(--mono); cursor: pointer; }
  dialog .checks input { width: auto; margin: 0; accent-color: var(--accent); }
  dialog textarea {
    width: 100%; font: 13px/1.4 var(--mono); color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; resize: vertical;
  }
  dialog textarea:focus { outline: none; border-color: var(--accent); }
  dialog code { display: block; font: 12px var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; }
  dialog pre { font: 11.5px/1.4 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; max-height: 260px; overflow: auto; white-space: pre-wrap; }
  dialog select { width: 100%; font: 13px var(--mono); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  dialog .err { color: var(--danger); font-size: 12px; margin-top: 8px; min-height: 1em; }
</style>
</head>
<body>
<aside>
  <div class="grip" id="grip" title="Drag to resize · double-click to reset"></div>
  <div class="brand"><b>claude-mux</b><span class="row"><button id="addHost" title="Add an environment: an SSH host, a Docker container, a WSL distro">+ Env</button><button id="new" title="New tab (⌥N)">+ New</button></span></div>
  <div class="summary" id="summary"></div>
  <div class="list" id="list"></div>
  <div class="foot">
    <kbd>⌥1–9</kbd> tab · <kbd>⌥↑↓</kbd> prev/next · <kbd>⌥J</kbd> next waiting<br>
    <kbd>⌥N</kbd> new · <kbd>⇧↵</kbd> newline
    <div class="prefs">
      <label>Theme <select id="pageTheme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
      <label>Terminal <select id="termTheme"><option value="auto">Auto</option><option value="dark">Dark</option><option value="light">Light</option><option value="tokyo-night">Tokyo Night</option><option value="dracula">Dracula</option><option value="solarized-dark">Solarized Dark</option><option value="solarized-light">Solarized Light</option></select></label>
    </div>
    <div><button id="notify" hidden>Enable notifications</button></div>
  </div>
</aside>
<main>
  <div class="bar" id="bar"></div>
  <div class="stage" id="stage">
    <div class="placeholder" id="placeholder">
      <div><p>No tab selected.</p><p><button class="primary" id="new2">+ New session</button></p></div>
    </div>
  </div>
</main>

<div class="menu" id="menu"></div>

<datalist id="groups"></datalist>

<dialog id="askDlg">
  <form method="dialog" id="askForm">
    <h3 id="aTitle"></h3>
    <label id="aHint"></label>
    <input id="aLine" list="groups" autocomplete="off">
    <textarea id="aText" rows="5" placeholder="e.g. restart the ops watch"></textarea>
    <div class="row"><button type="button" id="aCancel">Cancel</button><button class="primary">Save</button></div>
  </form>
</dialog>

<datalist id="targets"></datalist>

<dialog id="hostDlg">
  <form method="dialog" id="hostForm">
    <h3>Add an environment</h3>
    <label for="hKind">Kind</label>
    <select id="hKind"></select>
    <label for="hHost" id="hHint"></label>
    <input id="hHost" list="targets" autocomplete="off">
    <label for="hName">Name</label>
    <input id="hName" placeholder="defaults to the host" autocomplete="off">
    <div class="err" id="hostErr"></div>
    <div class="row"><button type="button" id="hostCancel">Cancel</button><button class="primary">Add</button></div>
  </form>
</dialog>

<dialog id="installDlg">
  <h3 id="iTitle"></h3>
  <label>Runs Anthropic's official installer there:</label>
  <code id="iCmd"></code>
  <pre id="iOut" hidden></pre>
  <div class="row"><button type="button" id="iClose">Cancel</button><button class="primary" id="iRun">Install</button></div>
</dialog>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h3 id="dlgTitle">New tab</h3>
    <div id="fEnvRow"><label for="fEnv">Environment</label><select id="fEnv"></select></div>
    <label for="fName">Name</label>
    <input id="fName" placeholder="defaults to the folder name" autocomplete="off">
    <label for="fGroup">Group</label>
    <input id="fGroup" list="groups" placeholder="none" autocomplete="off">
    <label for="fCwd">Directory</label>
    <input id="fCwd" list="cwds" autocomplete="off">
    <datalist id="cwds"></datalist>
    <label for="fStartup">Startup message</label>
    <input id="fStartup" placeholder="sent as the first prompt whenever it starts; optional" autocomplete="off">
    <label for="fArgs">Extra claude args</label>
    <input id="fArgs" placeholder="e.g. --model opus --permission-mode acceptEdits" autocomplete="off">
    <div class="checks">
      <label><input type="checkbox" id="fSkip"> --dangerously-skip-permissions</label>
      <label><input type="checkbox" id="fChrome"> --chrome</label>
    </div>
    <div class="err" id="dlgErr"></div>
    <div class="row"><button type="button" id="dlgCancel">Cancel</button><button class="primary" id="dlgOk">Start</button></div>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// The hub reports the environments; each environment's backend reports its
// tabs. A tab's key is "<environment>/<id>".
let envs = [];                   // [{name, kind, target, state, error}]
const envData = new Map();       // environment -> its backend's state: {claude, sessions, defaultCwd}
const streams = new Map();       // environment -> EventSource of its backend's state
let tabs = [];                   // every environment's tabs in sidebar order: {...session, env, key}
let selected = null;             // the selected tab's key
let pendingSelect = store.get("mux.selected"); // the last selection, until its tab shows up
const terms = new Map();         // tab key -> {term, fit, ws, el, closed}
const lastStatus = new Map();    // tab key -> status, for notifications

const STATUS_TEXT = {
  starting: "starting", working: "working", ready: "ready for input",
  "needs-you": "needs you", exited: "exited", stopped: "stopped",
};

// ---------- api ----------
async function request(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = res.status === 204 ? null : await res.json(); } catch {}
  if (!res.ok) {
    const err = new Error(data?.error || res.statusText);
    err.data = data;
    throw err;
  }
  return data;
}
// api calls an environment's backend, through the hub.
const api = (env, method, path, body) => request(method, `/env/${encodeURIComponent(env)}${path}`, body);

// ---------- helpers ----------
function ago(ts) {
  const s = Math.max(0, (Date.now() - new Date(ts).getTime()) / 1000);
  if (s < 60) return `${Math.floor(s)}s`;
  if (s < 3600) return `${Math.floor(s / 60)}m`;
  if (s < 86400) return `${Math.floor(s / 3600)}h`;
  return `${Math.floor(s / 86400)}d`;
}
const base = (p) => p.split("/").filter(Boolean).pop() || p;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const waiting = (t) => t.status === "needs-you" || (t.status === "ready" && t.unseen);
const tab = (key) => tabs.find((t) => t.key === key);
const env = (name) => envs.find((e) => e.name === name);
const dead = (t) => t.status === "exited" || t.status === "stopped";
const sessionsOf = (name) => envData.get(name)?.sessions || [];

// ---------- groups ----------
// A group is a label on tabs; its tabs sit together under one header.
// Collapsing is per browser, per environment.
const collapsed = new Set((() => { try { return JSON.parse(store.get("mux.collapsed") || "[]"); } catch { return []; } })());
function setCollapsed(key, shut) {
  shut ? collapsed.add(key) : collapsed.delete(key);
  store.set("mux.collapsed", JSON.stringify([...collapsed]));
}
const groupsOf = (name) => [...new Set(sessionsOf(name).map((s) => s.group).filter(Boolean))];

// grouped splits items into runs: each group, at its first item, and every
// ungrouped item on its own.
function grouped(items, groupOf) {
  const runs = [];
  const byName = new Map();
  for (const it of items) {
    const g = groupOf(it);
    if (!g) { runs.push({ group: "", items: [it] }); continue; }
    if (!byName.has(g)) { byName.set(g, { group: g, items: [] }); runs.push(byName.get(g)); }
    byName.get(g).items.push(it);
  }
  return runs;
}

// The most urgent status among tabs, shown on a collapsed group's header.
function urgent(list) {
  if (list.some((t) => t.status === "needs-you")) return "needs-you";
  if (list.some((t) => t.status === "ready" && t.unseen)) return "ready";
  if (list.some((t) => t.status === "working" || t.status === "starting")) return "working";
  return "";
}

// ---------- icon ----------
// Tabs on the left, a prompt on the right; a dot when something waits:
// amber for a session that needs you, green for one that finished unseen.
function favicon(dot) {
  const badge = dot ? `<circle cx="48" cy="16" r="14" fill="${dot}" stroke="#0f1115" stroke-width="4"/>` : "";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">` +
    `<rect x="2" y="2" width="60" height="60" rx="14" fill="#1c2029" stroke="#7aa2f7" stroke-width="3"/>` +
    `<rect x="10" y="14" width="12" height="7" rx="2" fill="#7aa2f7"/>` +
    `<rect x="10" y="28" width="12" height="7" rx="2" fill="#7aa2f7" opacity=".55"/>` +
    `<rect x="10" y="42" width="12" height="7" rx="2" fill="#7aa2f7" opacity=".55"/>` +
    `<path d="M30 22l9 9-9 9" fill="none" stroke="#e6e9ef" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<path d="M43 44h11" stroke="#e6e9ef" stroke-width="5" stroke-linecap="round"/>${badge}</svg>`;
  const href = "data:image/svg+xml," + encodeURIComponent(svg);
  if ($("favicon").href !== href) $("favicon").href = href;
}

// ---------- rendering ----------
let dragKey = null;       // the tab being dragged; renders wait for the drop
let renderPending = false;

function render() {
  if (dragKey) { renderPending = true; return; }
  const needs = tabs.filter((t) => t.status === "needs-you").length;
  const ready = tabs.filter((t) => t.status === "ready").length;
  const working = tabs.filter((t) => t.status === "working" || t.status === "starting").length;
  $("summary").innerHTML =
    `<span class="n">${needs}</span> need you · <span class="n">${ready}</span> ready · <span class="n">${working}</span> working`;
  const waitingCount = tabs.filter(waiting).length;
  document.title = waitingCount ? `(${waitingCount}) claude-mux` : "claude-mux";
  favicon(needs ? "#f5b14c" : waitingCount ? "#4fd18b" : null);

  // With only this machine, connected and with claude, the page has no
  // environment headers: it looks as it did before environments.
  const plain = envs.length === 1 && envs[0].state === "connected" && envData.get(envs[0].name)?.claude?.path;
  let html = "";
  for (const e of envs) {
    const data = envData.get(e.name);
    const own = tabs.filter((t) => t.env === e.name);
    if (!plain) html += envHeader(e);
    if (e.state === "failed") html += `<div class="notice err">${esc(e.error)}</div>`;
    if (e.state === "connected" && data && !data.claude?.path) {
      html += `<div class="notice">claude isn't installed here.
        <span class="row"><button data-env-act="install" data-env="${esc(e.name)}">Install…</button><button data-env-act="retry" data-env="${esc(e.name)}">Retry</button></span></div>`;
    }
    for (const run of grouped(own, (t) => t.group)) {
      if (!run.group) { html += tabRow(run.items[0], false); continue; }
      const key = e.name + "/" + run.group;
      const shut = collapsed.has(key);
      const dot = shut ? urgent(run.items) : "";
      html += `<div class="group" data-env="${esc(e.name)}" data-group="${esc(run.group)}" title="Click to ${shut ? "expand" : "collapse"} · right-click for actions">
        <span class="caret">${shut ? "▸" : "▾"}</span><span class="gname">${esc(run.group)}</span><span class="gcount">${run.items.length}</span>
        ${dot ? `<span class="dot ${dot}"></span>` : ""}</div>`;
      if (!shut) for (const t of run.items) html += tabRow(t, true);
    }
    if (!own.length && e.state === "connected" && data?.claude?.path) html += `<div class="empty">No tabs — ⌥N starts one.</div>`;
  }
  $("list").innerHTML = html || `<div class="empty">Connecting…</div>`;
  renderBar();
}

function envHeader(e) {
  const where = e.kind === "local" ? "this machine" : `${e.kind} ${e.target}`;
  return `<div class="env" data-env="${esc(e.name)}" title="Right-click for actions">
    <span class="dot env-${esc(e.state)}"></span><b>${esc(e.name)}</b><span class="where">${esc(where)}</span>
    ${e.state !== "connected" ? `<span class="estate">${esc(e.state)}</span>` : ""}</div>`;
}

function tabRow(t, inGroup) {
  const i = tabs.indexOf(t);
  const cls = ["tab", inGroup && "in-group", selected === t.key && "active", t.unseen && "unseen", t.status === "needs-you" && "needs-you"].filter(Boolean).join(" ");
  return `<div class="${cls}" data-key="${esc(t.key)}" title="${esc(t.cwd)}" draggable="true">
    <span class="dot ${esc(t.status)}"></span>
    <span class="name">${t.startupMessage ? `<span class="mark" title="Startup message: ${esc(t.startupMessage)}">↻</span> ` : ""}${esc(t.name)}</span>
    <span class="key">${i < 9 ? "⌥" + (i + 1) : ""}</span>
    <span class="sub">${esc(STATUS_TEXT[t.status] || t.status)} · ${ago(t.statusSince)} · ${esc(base(t.cwd))}</span>
  </div>`;
}

// The top bar's buttons are the context menu's actions, minus copying and
// the startup message, so the two never disagree.
function renderBar() {
  const t = tab(selected);
  if (!t) { $("bar").innerHTML = `<span class="cwd">Pick a tab on the left.</span>`; return; }
  const items = menuItems({ kind: "tab", key: t.key }).filter((it) => it && !it[0].startsWith("copy-") && it[0] !== "startup-msg");
  const where = envs.length > 1 ? `${t.env}: ` : "";
  $("bar").innerHTML = `
    <span class="title" title="/rename in the session renames it">${esc(t.name)}</span>
    <span class="pill ${esc(t.status)}">${esc(STATUS_TEXT[t.status] || t.status)}</span>
    <span class="cwd" title="${esc(t.cwd)}">${esc(where + t.cwd)}</span>
    <span class="actions">${items.map(([act, label, cls]) => `<button data-act="${act}" class="${cls || ""}">${esc(label)}</button>`).join("")}</span>`;
}

// ---------- terminals ----------
function ensureTerm(key) {
  if (terms.has(key)) return terms.get(key);
  const el = document.createElement("div");
  el.className = "term";
  $("stage").appendChild(el);
  const term = new Terminal({
    fontFamily: '"JetBrains Mono", "SF Mono", Menlo, monospace',
    fontSize: 13,
    cursorBlink: true,
    allowProposedApi: true,
    scrollback: 20000,
    theme: termTheme(),
  });
  el.style.background = termTheme().background;
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.loadAddon(new WebLinksAddon.WebLinksAddon());
  term.open(el);
  const t = { term, fit, el, ws: null, closed: false, retry: 0 };

  // Shift+Enter: ESC CR, which Claude Code reads as a newline in the prompt.
  term.attachCustomKeyEventHandler((e) => {
    if (e.key === "Enter" && e.shiftKey) {
      if (e.type === "keydown") send(t, { t: "in", d: "\x1b\r" });
      return false;
    }
    return true;
  });
  term.onData((d) => send(t, { t: "in", d }));
  term.onResize(({ cols, rows }) => send(t, { t: "resize", c: cols, r: rows }));
  connect(key, t);
  terms.set(key, t);
  return t;
}

function send(t, msg) {
  if (t.ws && t.ws.readyState === WebSocket.OPEN) t.ws.send(JSON.stringify(msg));
}

function connect(key, t) {
  const { env, id } = tab(key);
  const ws = new WebSocket(`ws://${location.host}/env/${encodeURIComponent(env)}/api/sessions/${encodeURIComponent(id)}/term`);
  ws.binaryType = "arraybuffer";
  t.ws = ws;
  ws.onopen = () => {
    t.retry = 0;
    t.term.reset(); // the server replays its scrollback first
    send(t, { t: "resize", c: t.term.cols, r: t.term.rows });
  };
  ws.onmessage = (e) => t.term.write(new Uint8Array(e.data));
  ws.onclose = () => {
    if (t.closed) return;
    t.retry = Math.min(t.retry + 1, 6);
    setTimeout(() => { if (!t.closed && tab(key)) connect(key, t); }, 500 * t.retry);
  };
}

function dropTerm(key) {
  const t = terms.get(key);
  if (!t) return;
  t.closed = true;
  t.ws?.close();
  t.term.dispose();
  t.el.remove();
  terms.delete(key);
}

function fitSelected() {
  terms.get(selected)?.fit.fit();
}

// ---------- selection ----------
function select(key) {
  const t = tab(key);
  if (!t) return;
  selected = key;
  store.set("mux.selected", key);
  if (t.group) setCollapsed(t.env + "/" + t.group, false);
  for (const [k, x] of terms) x.el.classList.toggle("shown", k === key);
  $("placeholder").style.display = "none";
  const term = ensureTerm(key);
  term.el.classList.add("shown");
  requestAnimationFrame(() => { fitSelected(); term.term.focus(); });
  markSeen(key);
  render();
}

function markSeen(key) {
  const t = tab(key);
  if (t?.unseen && document.visibilityState === "visible") api(t.env, "POST", `/api/sessions/${t.id}/seen`).catch(() => {});
}

function step(dir) {
  if (!tabs.length) return;
  const i = tabs.findIndex((t) => t.key === selected);
  select(tabs[(i + dir + tabs.length) % tabs.length].key);
}

// ⌥J: the next tab that waits for you, permission prompts first.
function jumpWaiting() {
  const start = Math.max(0, tabs.findIndex((t) => t.key === selected));
  const rot = [...tabs.slice(start + 1), ...tabs.slice(0, start + 1)];
  const next = rot.find((t) => t.status === "needs-you") || rot.find((t) => t.status === "ready" && t.unseen);
  if (next) select(next.key);
}

// ---------- notifications ----------
function notifyTransitions() {
  for (const t of tabs) {
    const prev = lastStatus.get(t.key);
    lastStatus.set(t.key, t.status);
    if (!prev || prev === t.status) continue;
    if (t.status === "starting" || prev === "exited" || prev === "stopped") {
      const term = terms.get(t.key);
      if (term && term.ws?.readyState !== WebSocket.OPEN) { term.retry = 0; connect(t.key, term); }
    }
    if (t.status !== "ready" && t.status !== "needs-you") continue;
    const looking = document.visibilityState === "visible" && document.hasFocus() && selected === t.key;
    if (looking) continue;
    const body = t.status === "needs-you" ? "needs you" : "ready for input";
    // In claude-mux's own window the hub posts the notification.
    if (window.cmuxNotify) { window.cmuxNotify(t.name, body); continue; }
    if (typeof Notification === "undefined" || Notification.permission !== "granted") continue;
    const n = new Notification(t.name, { body, tag: t.key });
    n.onclick = () => { window.focus(); select(t.key); n.close(); };
  }
}

function updateNotifyButton() {
  const b = $("notify");
  b.hidden = typeof Notification === "undefined" || Notification.permission !== "default";
}

// ---------- state streams ----------
// refresh rebuilds the flat tab list after any state arrived.
function refresh() {
  tabs = envs.flatMap((e) => sessionsOf(e.name).map((s) => ({ ...s, env: e.name, key: e.name + "/" + s.id })));
  for (const key of [...terms.keys()]) if (!tab(key)) dropTerm(key);
  if (selected && !tab(selected)) {
    selected = null;
    $("placeholder").style.display = "";
  }
  if (pendingSelect && tab(pendingSelect)) { select(pendingSelect); pendingSelect = null; }
  notifyTransitions();
  if (selected) markSeen(selected);
  render();
}

// Each connected environment streams its backend's state; one that goes
// away takes its tabs with it.
function syncStreams() {
  for (const e of envs) {
    const es = streams.get(e.name);
    if (e.state !== "connected" || (es && es.readyState !== EventSource.CLOSED)) continue;
    const next = new EventSource(`/env/${encodeURIComponent(e.name)}/api/events`);
    next.onmessage = (m) => {
      const st = JSON.parse(m.data);
      envData.set(e.name, { ...st, sessions: st.sessions || [] });
      refresh();
    };
    streams.set(e.name, next);
  }
  for (const [name, es] of streams) {
    if (env(name)) continue;
    es.close();
    streams.delete(name);
    envData.delete(name);
  }
}

function streamHub() {
  const es = new EventSource("/hub/events");
  es.onmessage = (m) => { envs = JSON.parse(m.data) || []; syncStreams(); refresh(); };
  es.onerror = () => { $("summary").textContent = "claude-mux unreachable — retrying…"; };
}

// Install or look for claude again in an environment that has none.
async function envAct(what, name) {
  if (what === "retry") {
    await api(name, "POST", "/api/claude/check").catch((err) => alert(err.message));
    return;
  }
  $("iTitle").textContent = `Install claude on ${name}`;
  $("iCmd").textContent = envData.get(name)?.claude?.installer || "";
  $("iOut").textContent = "";
  $("iOut").hidden = true;
  $("iRun").hidden = false;
  $("iRun").disabled = false;
  $("iClose").textContent = "Cancel";
  $("iRun").onclick = async () => {
    $("iRun").disabled = true;
    $("iOut").hidden = false;
    $("iOut").textContent = "Installing… this takes a minute.";
    try {
      const res = await api(name, "POST", "/api/claude/install");
      const c = envData.get(name)?.claude;
      $("iOut").textContent = `${res.output.trim()}\n\nDone${c?.version ? ": " + c.version : ""}. In a new tab there, claude asks you to log in the first time.`;
    } catch (err) {
      $("iOut").textContent = `${err.data?.output?.trim() || ""}\n\nThe installer failed: ${err.message}`;
    }
    $("iRun").hidden = true;
    $("iClose").textContent = "Close";
  };
  $("iClose").onclick = () => $("installDlg").close();

}

// Drag a tab to reorder it within its environment; the backend keeps the
// order. Dropped on a tab, a tab takes that tab's group; dropped on a
// group's header, it joins the group at its end.
function dropSide(el, e) {
  const r = el.getBoundingClientRect();
  return e.clientY < r.top + r.height / 2 ? "before" : "after";
}
function clearDrop() {
  for (const t of $("list").querySelectorAll(".drop-before, .drop-after, .drop-into")) t.classList.remove("drop-before", "drop-after", "drop-into");
}
// dropTarget is the tab or group header under the pointer, if it is in the
// dragged tab's environment.
function dropTarget(e) {
  const el = e.target.closest(".tab, .group");
  if (!dragKey || !el) return null;
  const elEnv = el.classList.contains("group") ? el.dataset.env : tab(el.dataset.key)?.env;
  return elEnv === tab(dragKey)?.env ? el : null;
}
$("list").addEventListener("dragstart", (e) => {
  const row = e.target.closest(".tab");
  if (!row) return;
  dragKey = row.dataset.key;
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", dragKey);
  row.classList.add("dragging");
});
$("list").addEventListener("dragover", (e) => {
  const el = dropTarget(e);
  if (!el) return;
  e.preventDefault();
  clearDrop();
  if (el.classList.contains("group")) el.classList.add("drop-into");
  else if (el.dataset.key !== dragKey) el.classList.add("drop-" + dropSide(el, e));
});
$("list").addEventListener("drop", async (e) => {
  const el = dropTarget(e);
  if (!el || el.dataset.key === dragKey) return;
  e.preventDefault();
  const moved = tab(dragKey);
  const data = envData.get(moved.env);
  const ids = data.sessions.map((s) => s.id).filter((x) => x !== moved.id);
  let group;
  if (el.classList.contains("group")) {
    group = el.dataset.group;
    const last = data.sessions.filter((s) => s.group === group && s.id !== moved.id).pop();
    ids.splice(last ? ids.indexOf(last.id) + 1 : ids.length, 0, moved.id);
  } else {
    const over = tab(el.dataset.key);
    group = over.group || "";
    ids.splice(ids.indexOf(over.id) + (dropSide(el, e) === "after" ? 1 : 0), 0, moved.id);
  }
  const regroup = (moved.group || "") !== group;
  const s = data.sessions.find((x) => x.id === moved.id);
  s.group = group;
  data.sessions = ids.map((id) => data.sessions.find((x) => x.id === id));
  refresh();
  try {
    if (regroup) await api(moved.env, "PUT", `/api/sessions/${moved.id}/group`, { group });
    await api(moved.env, "PUT", "/api/sessions/order", { ids });
  } catch (err) {
    alert(err.message);
  }
});
$("list").addEventListener("dragend", () => {
  dragKey = null;
  renderPending = false;
  clearDrop();
  render();
});

// Right-click a tab, a group's header or an environment's header for its
// actions. A target is {kind: "tab", key}, {kind: "group", env, group} or
// {kind: "env", env}.
function menuItems(target) {
  if (target.kind === "env") {
    const e = env(target.env);
    return [["new-in-env", "New tab here…"], e?.kind !== "local" && null, e?.kind !== "local" && ["remove-env", "Remove environment", "danger"]].filter((x) => x !== false);
  }
  if (target.kind === "group") return [["new-in-group", "New tab in group…"], ["rename-group", "Rename group…"], null, ["ungroup", "Ungroup"]];
  const t = tab(target.key);
  if (!t) return [];
  return [
    dead(t) && ["start", "Resume"],
    ["group", "Group…"],
    ["startup-msg", "Startup message…"],
    null,
    t.claudeSessionId && ["copy-id", "Copy session id"],
    ["copy-cwd", "Copy directory"],
    null,
    ["close", "Close", "danger"],
  ].filter((x) => x !== false && x !== "" && x !== undefined);
}

function closeMenu() { $("menu").classList.remove("open"); }

$("list").addEventListener("contextmenu", (e) => {
  const el = e.target.closest(".tab, .group, .env");
  if (!el) return;
  e.preventDefault();
  const target = el.classList.contains("tab") ? { kind: "tab", key: el.dataset.key }
    : el.classList.contains("group") ? { kind: "group", env: el.dataset.env, group: el.dataset.group }
    : { kind: "env", env: el.dataset.env };
  const menu = $("menu");
  menu.innerHTML = menuItems(target)
    .map((it) => it ? `<button data-act="${it[0]}" class="${it[2] || ""}">${esc(it[1])}</button>` : "<hr>").join("");
  menu.onclick = (ev) => {
    const b = ev.target.closest("button[data-act]");
    if (!b) return;
    closeMenu();
    act(b.dataset.act, target);
  };
  menu.classList.add("open");
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.min(e.clientX, innerWidth - r.width - 8) + "px";
  menu.style.top = Math.min(e.clientY, innerHeight - r.height - 8) + "px";
});
window.addEventListener("pointerdown", (e) => { if (!e.target.closest("#menu")) closeMenu(); }, true);
window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });
window.addEventListener("blur", closeMenu);

$("bar").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]");
  if (b && selected) act(b.dataset.act, { kind: "tab", key: selected });
});

// act runs one action on a target: the selected tab from the top bar, or
// what was right-clicked.
async function act(what, target) {
  const t = target.kind === "tab" ? tab(target.key) : null;
  const name = t?.env ?? target.env;
  try {
    if (what === "start") {
      await api(name, "POST", `/api/sessions/${t.id}/start`);
      terms.get(t.key)?.term.focus();
    } else if (what === "close") {
      if (t.status !== "working" || confirm("It is working — close it anyway? The turn in progress is cut off.")) await api(name, "DELETE", `/api/sessions/${t.id}`);
    } else if (what === "group") {
      const group = await ask("Group", "Tabs with the same group sit together under one header. Empty takes it out of its group.", t.group || "", groupsOf(name));
      if (group !== null) await api(name, "PUT", `/api/sessions/${t.id}/group`, { group });
    } else if (what === "startup-msg") {
      const msg = await ask("Startup message", "Sent as the first prompt whenever this tab's claude starts: when it opens, on Resume, and on every claude-mux start. Empty means none.", t.startupMessage || null);
      if (msg !== null) await api(name, "PUT", `/api/sessions/${t.id}/startup-message`, { startupMessage: msg });
    } else if (what === "rename-group") {
      const to = await ask("Rename group", "Renames it on every tab; an existing group's name merges the two.", target.group, groupsOf(name));
      if (to && to !== target.group) await api(name, "POST", "/api/groups/rename", { from: target.group, to });
    } else if (what === "ungroup") {
      await api(name, "POST", "/api/groups/rename", { from: target.group, to: "" });
    } else if (what === "new-in-group") {
      openNew({ env: name, group: target.group });
    } else if (what === "new-in-env") {
      openNew({ env: name });
    } else if (what === "remove-env") {
      if (confirm(`Disconnect ${name} and remove it from the list? Its tabs are hung up and kept there: adding it again brings them back.`)) await request("DELETE", `/hub/environments/${encodeURIComponent(name)}`);
    } else if (what === "copy-id" || what === "copy-cwd") {
      const text = what === "copy-cwd" ? t.cwd : t.claudeSessionId;
      if (text) await navigator.clipboard.writeText(text);
    }
  } catch (err) {
    alert(err.message);
  }
}

// ask asks for one value: a name, with options to pick from (one line), or
// a message (several lines, when options is null). null when cancelled.
function ask(title, hint, value, options) {
  const oneLine = !!options;
  $("groups").innerHTML = (options || []).map((g) => `<option value="${esc(g)}">`).join("");
  $("aTitle").textContent = title;
  $("aHint").textContent = hint;
  $("aLine").hidden = !oneLine;
  $("aText").hidden = oneLine;
  const field = oneLine ? $("aLine") : $("aText");
  field.value = value || "";
  return new Promise((resolve) => {
    const done = (v) => { $("askDlg").close(); resolve(v); };
    $("askForm").onsubmit = (e) => { e.preventDefault(); done(field.value.trim()); };
    $("aCancel").onclick = () => done(null);
    $("askDlg").oncancel = () => resolve(null);
    $("askDlg").showModal();
    field.select();
  });
}

// Shortcuts are caught before the terminal sees them.
window.addEventListener("keydown", (e) => {
  if (!e.altKey || e.metaKey || e.ctrlKey) return;
  let handled = true;
  if (/^Digit[1-9]$/.test(e.code)) {
    const t = tabs[Number(e.code.slice(5)) - 1];
    if (t) select(t.key);
  } else if (e.code === "KeyN") openNew();
  else if (e.code === "KeyJ") jumpWaiting();
  else if (e.code === "ArrowUp") step(-1);
  else if (e.code === "ArrowDown") step(1);
  else handled = false;
  if (handled) { e.preventDefault(); e.stopPropagation(); }
}, true);

// The sidebar's right edge drags to resize it; the width is kept per browser.
function setSide(px) {
  const w = Math.min(600, Math.max(180, Math.round(px)));
  document.body.style.setProperty("--side", w + "px");
  return w;
}
{
  const saved = Number(store.get("mux.side"));
  if (saved) setSide(saved);
  const grip = $("grip");
  grip.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    grip.setPointerCapture(e.pointerId);
    grip.classList.add("dragging");
    document.body.classList.add("resizing");
  });
  grip.addEventListener("pointermove", (e) => {
    if (grip.hasPointerCapture(e.pointerId)) setSide(e.clientX);
  });
  grip.addEventListener("pointerup", (e) => {
    grip.releasePointerCapture(e.pointerId);
    grip.classList.remove("dragging");
    document.body.classList.remove("resizing");
    store.set("mux.side", String(setSide(e.clientX)));
    fitSelected();
  });
  grip.addEventListener("dblclick", () => { setSide(270); store.set("mux.side", "270"); fitSelected(); });
}

window.addEventListener("resize", fitSelected);
new ResizeObserver(fitSelected).observe($("stage"));
document.addEventListener("visibilitychange", () => { if (selected) markSeen(selected); });
window.addEventListener("focus", () => { if (selected) markSeen(selected); });
setInterval(render, 15000); // keep the "3m ago" labels moving

// ---------- boot ----------
updateNotifyButton();
streamHub();
</script>
