<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>claude-mux quick switcher</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; min-height: 900px; background: #0F1115; font-family: Inter, system-ui, sans-serif; color: #E6E8EC; font-size: 13px">
<dc-import name="Main" active-tab="billing-fix" hint-size="100%,900px"></dc-import>
<div style="position: absolute; inset: 0; background: rgba(6,7,9,0.62); display: flex; justify-content: center; align-items: flex-start; padding: 110px 16px 16px">
<div role="dialog" aria-label="Quick switcher" style="width: 640px; max-width: 100%; background: #171A20; border: 1px solid #2E3440; border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,0.5); overflow: hidden">
<label style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #252A33">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9098A8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input value="{{q}}" onChange="{{onQ}}" aria-label="Search tabs and actions" placeholder="Jump to a tab, or type > for actions" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #E6E8EC; font: inherit; font-size: 16px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9098A8; padding: 2px 6px; border: 1px solid #2B313C; border-radius: 4px">esc</span>
</label>
<div style="padding: 8px; max-height: 460px; overflow-y: auto">
<div style="font-size: 11px; font-weight: 600; color: #8A92A2; padding: 6px 10px">Tabs</div>
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button type="button" onMouseEnter="{{t.hover}}" style="{{t.rowStyle}}">
<span style="{{t.dot}}"></span>
<span style="font-weight: 600; flex: none">{{t.name}}</span>
<span style="font-size: 12px; color: #9098A8; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.where}}</span>
<span style="{{t.statusStyle}}">{{t.status}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A92A2; width: 28px; text-align: right">{{t.key}}</span>
</button>
</sc-for>
<div style="font-size: 11px; font-weight: 600; color: #8A92A2; padding: 12px 10px 6px">Actions</div>
<sc-for list="{{actions}}" as="a" hint-placeholder-count="4">
<button type="button" onMouseEnter="{{a.hover}}" style="{{a.rowStyle}}">
<span style="width: 8px; flex: none"></span>
<span style="flex: 1; text-align: left">{{a.label}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A92A2">{{a.key}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; gap: 16px; padding: 10px 16px; border-top: 1px solid #252A33; font-size: 11px; color: #9098A8; flex-wrap: wrap">
<span><span style="font-family: 'JetBrains Mono', monospace; color: #C4C9D3">↑↓</span> move</span>
<span><span style="font-family: 'JetBrains Mono', monospace; color: #C4C9D3">↵</span> open</span>
<span><span style="font-family: 'JetBrains Mono', monospace; color: #C4C9D3">⌘↵</span> open in split</span>
<span><span style="font-family: 'JetBrains Mono', monospace; color: #C4C9D3">⌘⌫</span> close tab</span>
<span style="flex: 1"></span>
<span>Waiting tabs first</span>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const q = s.q !== undefined ? s.q : '';
    const ql = q.toLowerCase();
    const sel = s.sel || 'billing-fix';
    const COL = { working: '#7AA2F7', ready: '#4FD18B', needs: '#F5B14C', exited: '#8A92A2' };
    const TABS = [
      ['billing-fix', 'local / api · fix/invoice-rounding', 'needs', 'Needs you', '⌥2'],
      ['docs-site', 'local / api · main', 'ready', 'Done, unseen', '⌥3'],
      ['rpc-gateway', 'local / api · feat/rate-limits', 'working', 'Working', '⌥1'],
      ['k8s-watch', 'local / infra · main', 'working', 'Working', '⌥5'],
      ['release-v0.9', 'build-box · release/v0.9', 'working', 'Working', '⌥6'],
      ['terraform-plan', 'local / infra · main', 'ready', 'Ready', '⌥4'],
      ['flaky-tests', 'build-box · main', 'exited', 'Exited', '⌥7']
    ];
    const row = (id) => 'display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 10px;border:0;border-radius:6px;cursor:pointer;font:inherit;font-size:13px;color:#E6E8EC;text-align:left;background:' + (sel === id ? '#232B3D' : 'transparent');
    const tabs = TABS.filter((t) => !ql || t[0].indexOf(ql) >= 0 || t[1].indexOf(ql) >= 0).map((t) => ({
      name: t[0], where: t[1], status: t[3], key: t[4],
      dot: t[2] === 'exited' ? 'width:8px;height:8px;border-radius:50%;border:1.5px solid #6B7383;box-sizing:border-box;flex:none' : 'width:8px;height:8px;border-radius:50%;flex:none;background:' + COL[t[2]],
      statusStyle: 'font-size:11px;font-weight:600;color:' + COL[t[2]],
      rowStyle: row(t[0]), hover: () => this.setState({ sel: t[0] })
    }));
    const ACT = [['New tab in local / api', '⌥N'], ['Split right with…', '⌘\\'], ['Switch tabs to the top strip', ''], ['Add environment…', ''], ['Open settings', '⌘,'], ['Restart this tab', '']];
    const actions = ACT.filter((a) => !ql || a[0].toLowerCase().indexOf(ql) >= 0).map((a) => ({
      label: a[0], key: a[1], rowStyle: row('a:' + a[0]), hover: () => this.setState({ sel: 'a:' + a[0] })
    }));
    return { q: q, onQ: (e) => this.setState({ q: e.target.value }), tabs: tabs, actions: actions };
  }
}
</script>
</body>
</html>
