<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>claude-mux v4 main window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.text}}; font-family: Inter, system-ui, sans-serif; font-size: 13px; line-height: 1.4">

<sc-if value="{{isTop}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 4px; padding: 6px 10px; background: {{c.panel}}; border-bottom: 1px solid {{c.line}}; overflow-x: auto">
<svg width="20" height="20" viewBox="0 0 64 64" aria-hidden="true" style="margin: 0 10px 0 4px; flex: none"><rect width="64" height="64" rx="14" fill="#161A21"></rect><rect x="20" y="10" width="34" height="27" rx="5" fill="#2E3542"></rect><rect x="10" y="22" width="36" height="30" rx="5" fill="#0B0D10" stroke="#7AA2F7" stroke-width="4"></rect><path d="M17 31l6 5-6 5" fill="none" stroke="#E6E8EC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<sc-for list="{{topTabs}}" as="t" hint-placeholder-count="5">
<button type="button" onClick="{{t.select}}" style="{{t.topStyle}}">
<span style="{{t.dotStyle}}"></span>
<span style="{{t.nameStyle}}">{{t.name}}</span>
</button>
</sc-for>
<button type="button" aria-label="New tab" style="width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: {{c.muted}}; cursor: pointer; flex: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<div style="flex: 1"></div>
<button type="button" style="height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: {{c.accent}}; font: inherit; font-size: 12px; cursor: pointer; flex: none">Update to 0.9.3</button>
<a href="Settings.dc.html" aria-label="Settings" style="width: 32px; height: 32px; display: grid; place-items: center; border-radius: 6px; color: {{c.muted}}; flex: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg></a>
</div>
</sc-if>

<div style="flex: 1 1 auto; display: flex; flex-wrap: wrap; min-height: 0">

<sc-if value="{{isLeft}}" hint-placeholder-val="{{ true }}">
<aside style="flex: 1 1 248px; max-width: 100%; display: flex; flex-direction: column; background: {{c.panel}}; border-right: 1px solid {{c.line}}">
<div style="display: flex; align-items: center; gap: 8px; padding: 12px 10px 12px 14px">
<svg width="20" height="20" viewBox="0 0 64 64" aria-hidden="true" style="flex: none"><rect width="64" height="64" rx="14" fill="#161A21"></rect><rect x="20" y="10" width="34" height="27" rx="5" fill="#2E3542"></rect><rect x="10" y="22" width="36" height="30" rx="5" fill="#0B0D10" stroke="#7AA2F7" stroke-width="4"></rect><path d="M17 31l6 5-6 5" fill="none" stroke="#E6E8EC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-weight: 700; font-size: 14px; letter-spacing: -0.01em; flex: 1">claude-mux</span>
<button type="button" aria-label="New tab" style="width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: {{c.text2}}; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<a href="Settings.dc.html" aria-label="Settings" style="width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: {{c.muted}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg></a>
</div>
<div style="padding: 0 10px 6px">
<a href="Palette.dc.html" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 6px; background: {{c.field}}; color: {{c.muted}}; text-decoration: none; font-size: 12px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<span style="flex: 1">Jump to tab</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px">⌘K</span>
</a>
</div>
<div style="flex: 1 1 auto; overflow-y: auto; padding: 0 8px 12px">
<sc-for list="{{envs}}" as="e" hint-placeholder-count="3">
<div style="margin-top: 12px">
<div title="{{e.meta}}" style="display: flex; align-items: center; gap: 8px; padding: 2px 8px 4px">
<span style="font-weight: 600; font-size: 11px; color: {{c.muted}}; flex: 1">{{e.label}}</span>
<span style="{{e.healthDot}}"></span>
</div>
<sc-if value="{{e.noClaude}}" hint-placeholder-val="{{ false }}">
<div style="padding: 4px 8px; font-size: 12px; color: {{c.muted}}">No claude here · <button type="button" style="border: 0; padding: 0; background: transparent; color: {{c.accentText}}; font: inherit; cursor: pointer">Install</button></div>
</sc-if>
<sc-for list="{{e.groups}}" as="g" hint-placeholder-count="2">
<div>
<sc-if value="{{g.hasLabel}}" hint-placeholder-val="{{ true }}">
<div style="padding: 6px 8px 2px 10px; color: {{c.muted}}; font-size: 12px">{{g.label}}</div>
</sc-if>
<sc-for list="{{g.tabs}}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{t.select}}" style="{{t.rowStyle}}">
<span style="{{t.dotStyle}}"></span>
<span style="{{t.nameStyle}}">{{t.name}}</span>
<sc-if value="{{t.startup}}" hint-placeholder-val="{{ false }}"><span title="Has a startup message" style="font-size: 12px; color: {{c.muted}}">↻</span></sc-if>
</button>
</sc-for>
</div>
</sc-for>
</div>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 8px; margin: 0 10px 10px; padding: 8px 10px; border-radius: 6px; background: {{c.accentSoft}}; font-size: 12px">
<span style="flex: 1; color: {{c.text2}}">0.9.3 is out</span>
<button type="button" style="border: 0; padding: 0; background: transparent; color: {{c.accentText}}; font: inherit; font-weight: 600; cursor: pointer">Update and restart</button>
</div>
</aside>
</sc-if>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; background: {{c.bg}}">
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 18px; border-bottom: 1px solid {{c.line}}; flex-wrap: wrap">
<span style="font-weight: 600; font-size: 14px">{{cur.name}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{c.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 200px">{{cur.crumb}}</span>
<a href="V4TabSettings.dc.html" aria-label="Tab settings" title="Tab settings" style="width: 32px; height: 32px; display: grid; place-items: center; border-radius: 6px; color: {{c.muted}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></a>
</div>
<div style="flex: 1 1 auto; display: flex; padding: 8px; min-height: 0">
<section aria-label="{{cur.name}}" style="flex: 1; min-width: 0; background: {{c.term}}; border-radius: 8px; border: 1px solid {{c.termLine}}; padding: 14px 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.65; overflow: hidden">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="8">
<div>
<sc-if value="{{l.isText}}" hint-placeholder-val="{{ true }}"><div style="{{l.style}}">{{l.t}}</div></sc-if>
<sc-if value="{{l.isBox}}" hint-placeholder-val="{{ false }}">
<div style="margin: 10px 0; padding: 10px 14px; border: 1px solid {{c.needs}}; border-radius: 6px; color: {{c.termText}}">
<div style="color: {{c.needs}}; font-weight: 500">Bash command</div>
<div style="padding: 4px 0 8px 12px; color: {{c.termStrong}}">go test ./internal/invoice/...</div>
<div>Do you want to proceed?</div>
<div style="color: {{c.accent}}">❯ 1. Yes</div>
<div style="color: {{c.termDim}}">  2. Yes, and don't ask again for go test commands</div>
<div style="color: {{c.termDim}}">  3. No, and tell Claude what to do differently (esc)</div>
</div>
</sc-if>
<sc-if value="{{l.isPrompt}}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 10px; padding: 6px 12px; border: 1px solid {{c.boxLine}}; border-radius: 6px; display: flex; gap: 8px"><span style="color: {{c.termDim}}">&gt;</span><span style="width: 8px; height: 18px; background: {{c.text2}}"></span></div>
</sc-if>
</div>
</sc-for>
</section>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"layout":{"editor":"enum","options":["left","top"],"default":"left"},"activeTab":{"editor":"enum","options":["rpc-gateway","billing-fix","docs-site","terraform-plan","k8s-watch","release-v0.9","flaky-tests"],"default":"billing-fix"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const layout = this.props.layout || 'left';
    const THEMES = {
      dark: { bg: '#0F1115', panel: '#14171C', line: '#252A33', field: '#1B1F26', sel: '#232834', term: '#0B0D10', termLine: '#1E222A', boxLine: '#3A3F4A', text: '#E6E8EC', text2: '#C4C9D3', muted: '#8A92A2', accent: '#7AA2F7', accentSoft: '#1B2233', accentText: '#AFC6FA', working: '#7AA2F7', ready: '#4FD18B', needs: '#F5B14C', halo: 'rgba(245,177,76,0.25)', exited: '#6B7383', exitedText: '#8A92A2', termText: '#D7DAE0', termDim: '#9098A8', termStrong: '#E6E8EC', mark: '#161A21', markFg: '#E6E8EC' },
      light: { bg: '#FFFFFF', panel: '#F6F7F9', line: '#E3E6EB', field: '#ECEEF2', sel: '#E2E7F0', term: '#FBFBFC', termLine: '#E3E6EB', boxLine: '#C9CED8', text: '#1D2129', text2: '#3D4452', muted: '#626A7A', accent: '#2F5FD0', accentSoft: '#E8EEFB', accentText: '#2A55BD', working: '#2F5FD0', ready: '#1F9D5C', needs: '#B86F0A', halo: 'rgba(184,111,10,0.2)', exited: '#9AA1AD', exitedText: '#7A8291', termText: '#2B303A', termDim: '#626A7A', termStrong: '#1D2129', mark: '#1D2129', markFg: '#FFFFFF' }
    };
    const c = THEMES[this.props.theme] || THEMES.dark;
    const activeId = s.active || this.props.activeTab || 'billing-fix';
    const COL = { working: c.working, ready: c.ready, needs: c.needs };
    const TABS = [
      { id: 'rpc-gateway', env: 'local', group: 'api', cwd: '~/src/rpc-gateway', branch: 'feat/rate-limits', status: 'working' },
      { id: 'billing-fix', env: 'local', group: 'api', cwd: '~/src/billing', branch: 'fix/invoice-rounding', status: 'needs' },
      { id: 'docs-site', env: 'local', group: 'api', cwd: '~/src/docs', branch: 'main', status: 'ready', unread: true },
      { id: 'terraform-plan', env: 'local', group: 'infra', cwd: '~/infra/terraform', branch: 'main', status: 'ready' },
      { id: 'k8s-watch', env: 'local', group: 'infra', cwd: '~/infra/k8s', branch: 'main', status: 'working', startup: true },
      { id: 'release-v0.9', env: 'build-box', group: '', cwd: '/srv/claude-mux', branch: 'release/v0.9', status: 'working' },
      { id: 'flaky-tests', env: 'build-box', group: '', cwd: '/srv/claude-mux', branch: 'main', status: 'exited' }
    ];
    const byId = {}; TABS.forEach((t) => { byId[t.id] = t; });
    const dot = (t) => {
      if (t.status === 'exited') return 'width:8px;height:8px;border-radius:50%;border:1.5px solid ' + c.exited + ';box-sizing:border-box;flex:none';
      const halo = t.status === 'needs' ? ';box-shadow:0 0 0 3px ' + c.halo : '';
      return 'width:8px;height:8px;border-radius:50%;flex:none;background:' + COL[t.status] + halo;
    };
    const dec = (t) => {
      const active = t.id === activeId;
      const bold = active || t.unread || t.status === 'needs';
      return Object.assign({}, t, {
        name: t.id, startup: !!t.startup,
        dotStyle: dot(t),
        nameStyle: 'flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:' + (bold ? '600' : '400') + ';color:' + (t.status === 'exited' ? c.exitedText : c.text),
        rowStyle: 'display:flex;align-items:center;gap:10px;width:100%;height:30px;padding:0 10px;border:0;border-radius:6px;cursor:pointer;text-align:left;font:inherit;color:inherit;background:' + (active ? c.sel : 'transparent'),
        topStyle: 'display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:0;border-radius:6px;font:inherit;cursor:pointer;flex:none;color:inherit;background:' + (active ? c.sel : 'transparent'),
        crumb: t.env + (t.group ? ' / ' + t.group : '') + '  ·  ' + t.cwd + '  ·  ' + t.branch,
        select: () => this.setState({ active: t.id })
      });
    };
    const ENVS = [
      { id: 'local', label: 'local', meta: 'This Mac · connected', health: c.ready },
      { id: 'build-box', label: 'build-box', meta: 'SSH · 42 ms', health: c.ready },
      { id: 'sandbox', label: 'sandbox', meta: 'Docker · no claude', health: c.needs, noClaude: true }
    ];
    const envs = ENVS.map((e) => {
      const tabs = TABS.filter((t) => t.env === e.id);
      const gs = [];
      tabs.forEach((t) => { if (gs.indexOf(t.group) < 0) gs.push(t.group); });
      return Object.assign({}, e, {
        noClaude: !!e.noClaude,
        healthDot: 'width:6px;height:6px;border-radius:50%;flex:none;background:' + e.health,
        groups: gs.map((g) => ({ label: g, hasLabel: !!g, tabs: tabs.filter((t) => t.group === g).map(dec) }))
      });
    });
    const cur = dec(byId[activeId] || byId['billing-fix']);
    const T = (t, col) => ({ isText: true, isBox: false, isPrompt: false, t: t, style: 'white-space:pre-wrap;color:' + (col || c.termText) });
    let lines;
    if (cur.id === 'billing-fix') lines = [
      T('> fix the rounding on multi-currency invoices, totals are off by a cent', c.termDim), T(' '),
      T('● Read(internal/invoice/total.go)', c.termStrong), T('● Read(internal/invoice/total_test.go)', c.termStrong), T(' '),
      T('  The total is summed in float64 and rounded once. The ledger rounds per line,'), T('  so I will switch to integer minor units and round each line.'), T(' '),
      T('● Update(internal/invoice/total.go)', c.termStrong), T('  ⎿  Added 14 lines, removed 9 lines', c.termDim),
      { isText: false, isBox: true, isPrompt: false }
    ];
    else if (cur.status === 'working') lines = [
      T('> add per-key rate limits to the gateway, 100 rps default, config override', c.termDim), T(' '),
      T('● Read(internal/limit/bucket.go)', c.termStrong), T('● Update(internal/limit/bucket.go)', c.termStrong), T('  ⎿  Added 38 lines, removed 4 lines', c.termDim),
      T('● Bash(go test ./internal/limit/...)', c.termStrong), T('  ⎿  Running…', c.termDim), T(' '),
      T('✻ Testing… (42s · esc to interrupt)', c.accent)
    ];
    else if (cur.status === 'exited') lines = [T('> find why TestReconnect flakes on CI', c.termDim), T('● Bash(go test -run TestReconnect -count 50 ./internal/hub)', c.termStrong), T('  ⎿  ok  (50 runs, 0 failures)', c.termDim), T('> /exit', c.termDim), T(' '), T('claude exited. Press Enter to resume.', c.needs)];
    else lines = [
      T('> update the README for the new config keys', c.termDim), T(' '),
      T('● Update(README.md)', c.termStrong), T('  ⎿  Added 12 lines', c.termDim), T(' '),
      T('  Done. The new keys are documented under Configuration, with defaults.'),
      { isText: false, isBox: false, isPrompt: true }
    ];
    return {
      c: c, isLeft: layout === 'left', isTop: layout === 'top',
      envs: envs, cur: cur, lines: lines,
      topTabs: TABS.filter((t) => t.env === cur.env).map(dec)
    };
  }
}
</script>
</body>
</html>
